    if (field.kind === "list_str") {
      const input = document.createElement("input");
      input.id = fieldId;
      input.type = "text";
      input.value = (value || []).join(", ");
      input.addEventListener("change", () => {
        setPath(
          draft, path,
          input.value.split(",").map((s) => s.trim()).filter(Boolean)
        );
      });
      return input;
    }

    if (field.kind === "command") {
      const input = document.createElement("input");
      input.id = fieldId;
      input.type = "text";
      input.value = (value || []).join(" ");
      input.addEventListener("change", () => {
        setPath(draft, path, input.value.trim() ? splitCommand(input.value) : null);
      });
      return input;
    }

    if (["int", "optional_int", "float", "optional_float"].includes(field.kind)) {
      const input = document.createElement("input");
      input.id = fieldId;
      input.type = "number";
      if (field.kind === "float" || field.kind === "optional_float") input.step = "any";
      input.value = value === null || value === undefined ? "" : String(value);
      input.addEventListener("change", () => {
        if (input.value === "") {
          setPath(draft, path, field.kind.startsWith("optional") ? null : 0);
          return;
        }
        const n = Number(input.value);
        if (!Number.isNaN(n)) setPath(draft, path, n);
      });
      return input;
    }

    // str / optional_str
    const input = document.createElement("input");
    input.id = fieldId;
    input.type = "text";
    input.value = value === null || value === undefined ? "" : String(value);
    input.addEventListener("change", () => {
      setPath(draft, path, input.value === "" && field.kind === "optional_str" ? null : input.value);
    });
    return input;
  }

  function buildFieldRow(field) {
    const path = `${field.section}.${field.key}`;
    const wrap = document.createElement("div");
    wrap.className = "settings-field";

    const label = document.createElement("label");
    label.textContent = field.label;
    label.htmlFor = fieldElementId(path);
    wrap.appendChild(label);

    // Input device/output device get their own [Test] button, same
    // per-field granularity as the TUI's own [t] on those two fields
    // (probe_audio tests only the relevant direction when a field_key is
    // given -- see settings_tui.py's probe_audio docstring).
    if (field.kind === "device") {
      const row = document.createElement("div");
      row.className = "settings-field-row";
      row.appendChild(buildInput(field, path));
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "settings-test-btn";
      btn.textContent = "Test";
      // Matches probe_audio()'s real, direction-specific behavior
      // (scripts/settings_tui.py) -- input records-then-plays-back so you
      // can hear whether the right mic is picking you up; output just
      // plays a tone. Don't blur the two into one generic "plays a tone"
      // claim -- that would be wrong for input_device.
      btn.title = field.key === "input_device"
        ? "Records a few seconds from this mic, then plays it back through your speaker so you can hear if it's the right one"
        : field.key === "output_device"
        ? "Plays a short test tone through this speaker/output"
        : `Tests the audio device(s) relevant to ${field.label}`;
      btn.addEventListener("click", () => runTest(field.section, field.key));
      row.appendChild(btn);
      wrap.appendChild(row);
    } else {
      wrap.appendChild(buildInput(field, path));
    }

    if (field.help_text) {
      const help = document.createElement("div");
      help.className = "help";
      help.textContent = field.help_text;
      wrap.appendChild(help);
    }
    return wrap;
  }

  function renderBody() {
    bodyEl.innerHTML = "";
    const section = sections.find((s) => s.key === activeKey);
    if (!section) return;
    // Always-visible text, not just the tab's hover title -- this is
    // what actually carries the restart-required meaning to a screen
    // reader or anyone who never hovers a tab (WCAG: don't gate
    // important state behind a hover-only tooltip).
    const note = document.createElement("div");
    note.className = "settings-section-note " + (section.restart_required ? "restart" : "live");
    note.textContent = section.restart_required
      ? "⟳ Changes here need ConvoBox restarted to take effect."
      : "✓ Changes here apply on your next page refresh -- no restart needed.";
    bodyEl.appendChild(note);
    for (const field of section.fields) bodyEl.appendChild(buildFieldRow(field));
    testSectionBtn.hidden = !TESTABLE_SECTIONS.includes(activeKey);
  }

  function setStatus(message, isError, isPending) {
    statusEl.textContent = message;
    statusEl.className = "settings-status" + (isError ? " error" : "") + (isPending ? " pending" : "");
  }

  async function runTest(section, field) {
    // A not-yet-cached STT model (esp. large-v3, ~3GB) can take a while to
    // download -- an elapsed timer + spinner so this reads as "working",
    // not "hung". Client-side only: the fetch itself doesn't report byte
    // progress, and hooking huggingface_hub's internal download callback
    // for that isn't worth the fragility for this.
    const controller = new AbortController();
    let cancelled = false;
    cancelTestBtn.hidden = false;
    cancelTestBtn.onclick = () => {
      // Aborting the fetch only stops the BROWSER waiting -- it can't
      // stop the server's background thread mid-download (no safe way to
      // kill a Python thread, no cancellation hook into huggingface_hub's
      // transfer loop; see _run_with_spinner's docstring in
      // settings_tui.py for the TUI's identical constraint). The server
      // keeps downloading/testing in the background regardless; this
      // just stops this tab from waiting on it.
      cancelled = true;
      controller.abort();
    };
    const start = performance.now();
    const tick = () => {
      const elapsedS = Math.floor((performance.now() - start) / 1000);
      setStatus(`Testing… (${elapsedS}s) -- a not-yet-cached model can take a while to download`, false, true);
    };
    tick();
    const timer = setInterval(tick, 1000);
    try {
      const res = await fetch("/api/settings/test", {
        method: "POST",
        headers: { ...CSRF_HEADERS, "Content-Type": "application/json" },
        body: JSON.stringify({ section, field: field || null, values: draft }),
        signal: controller.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        setStatus(data.detail || "Test failed.", true);
        return;
      }
      setStatus(data.status, false);
    } catch (err) {
      if (cancelled) {
        setStatus("cancelled -- the server keeps running it in the background; this status may still change once it finishes", false);
      } else {
        setStatus("Test failed: " + err, true);
      }
    } finally {
      clearInterval(timer);
      cancelTestBtn.hidden = true;
      cancelTestBtn.onclick = null;
    }
  }

  async function saveSettings() {
    saveBtn.disabled = true;
    errorsEl.hidden = true;
    // Computed BEFORE originalValues gets overwritten below -- a section
    // whose own subtree didn't change doesn't force a restart message,
    // even if some OTHER dirty section (edited, then left, without
    // saving) does. Matches each section's own banner (renderBody()),
    // which is per-section, not a single blanket claim for the whole
    // form.
    const anyChangedSectionNeedsRestart = sections.some(
      (s) => s.restart_required && JSON.stringify(draft[s.key]) !== JSON.stringify(originalValues[s.key])
    );
    try {
      const res = await fetch("/api/settings/save", {
        method: "POST",
        headers: { ...CSRF_HEADERS, "Content-Type": "application/json" },
        body: JSON.stringify({ values: draft }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail || {};
        errorsEl.textContent = (detail.errors || ["Save failed."]).join(" | ");
        errorsEl.hidden = false;
        return;
      }
      originalValues = JSON.parse(JSON.stringify(draft));
      setStatus(
        anyChangedSectionNeedsRestart
          ? "Saved -- restart ConvoBox for changes to take effect."
          : "Saved -- changes apply on your next page refresh, no restart needed.",
        false
      );
    } catch (err) {
      errorsEl.textContent = "Save failed: " + err;
      errorsEl.hidden = false;
    } finally {
      saveBtn.disabled = false;
    }
  }

  // Same arm/confirm shape as the ribbon's Quit button: closing with
  // unsaved changes needs a second click, not a native confirm() dialog
  // (this file never uses alert/confirm/prompt anywhere else).
  let closeArmed = false;
  let closeArmTimer = null;

  function isDirty() {
    return JSON.stringify(draft) !== JSON.stringify(originalValues);
  }

  function doClose() {
    overlay.hidden = true;
    closeArmed = false;
    clearTimeout(closeArmTimer);
    closeBtn.textContent = "×";
    // Focus must never just vanish when a modal closes (WCAG 2.4.3) --
    // settingsBtn is the only thing that ever opens this dialog, so
    // there's no "previously focused element" to track, just send focus
    // straight back to it.
    settingsBtn.focus();
  }

  function attemptClose() {
    if (!isDirty() || closeArmed) {
      doClose();
      return;
    }
    closeArmed = true;
    closeBtn.textContent = "↩"; // discard-and-return arrow, armed state
    closeBtn.title = "Unsaved changes -- click again to discard and close";
    closeArmTimer = setTimeout(() => {
      closeArmed = false;
      closeBtn.textContent = "×";
      closeBtn.title = "Close settings";
    }, 4000);
  }

  closeBtn.addEventListener("click", attemptClose);

  // Keyboard support a modal dialog is expected to have (WCAG 2.1.1/2.1.2):
  // Esc closes it (same arm/discard-confirm as the × button, not a silent
  // bypass of unsaved-changes protection), and Tab/Shift+Tab cycle only
  // among the dialog's own focusable elements instead of escaping into the
  // page underneath -- aria-modal="true" on its own does not enforce this
  // in any browser; it has to be done by hand.
  overlay.addEventListener("keydown", (e) => {
    if (overlay.hidden) return;
    if (e.key === "Escape") {
      e.preventDefault();
      attemptClose();
      return;
    }
    if (e.key !== "Tab") return;
    const focusable = Array.from(
      overlay.querySelectorAll(
        'button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])'
      )
    ).filter((el) => el.offsetParent !== null); // skip hidden (e.g. [hidden] ancestors, display:none)
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  saveBtn.addEventListener("click", saveSettings);
  testSectionBtn.addEventListener("click", () => runTest(activeKey, null));

  settingsBtn.addEventListener("click", async () => {
    const res = await fetch("/api/settings");
    const data = await res.json();
    originalValues = data.values;
    draft = JSON.parse(JSON.stringify(originalValues));
    activeKey = null;
    setStatus("", false);
    errorsEl.hidden = true;
    overlay.hidden = false;
    await fetchSchema();
    // Send focus INTO the dialog now that it has real content -- a modal
    // that opens without moving focus leaves a screen reader/keyboard
    // user still "in" the page behind it, unaware anything changed.
    closeBtn.focus();
  });
})();
</script>
<script>
// PWA install-ability (docs/field-notes/2026-07-28-other-claude-code-web-
// uis-dont-transfer-much.md): app-shell-only caching, sw.js never touches
// /api/ or the SSE stream -- see that file's own comments. Optional
// (older browsers without serviceWorker support just skip this).
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.error("service worker registration failed", err);
    });
  });
}
</script>
</body>
</html>
