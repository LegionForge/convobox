# LegionForge dev-rig CI: test/lint/SAST/dependency-audit/SBOM/secrets.
#
# Consumes LegionForge/dev-rig's shared reusable workflows (shared Python CI
# + security rig used across LegionForge projects) rather than duplicating
# tool config here. See TESTING.md -> "CI / LegionForge dev-rig" for what
# each job checks, why it's scoped the way it is, and how to run the same
# checks locally before pushing.
#
# Pinned to a commit SHA, not a tag: LegionForge/dev-rig has cut no tagged
# release as of this writing (confirmed via `gh api repos/LegionForge/dev-rig/tags`
# returning empty) -- dev-rig's own README examples currently show `@main`,
# a mutable ref this project deliberately does not consume (see
# LegionForge/dev-rig's pipeline-hardening handoff doc: never consume
# `@main`, use a pinned tag once one exists). SHA-pin is the correct
# available-today choice; re-pin to a released tag once dev-rig cuts one.
#
# DEV_RIG_REF: 468d5a7c30f6540a472a32d8b3bea1ac381f2017 (main, 2026-07-10)

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Added 2026-08-25 alongside the process-kill-matrix job below, whose
  # own `if:` restricts it to push/workflow_dispatch (not every PR) --
  # needs a real trigger source to dispatch from at all. Every other job
  # in this file is unaffected: none of them gate on event_name, so they
  # keep running on pull_request/push exactly as before: this only adds
  # a new way to ALSO run the full workflow on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests & Coverage
    uses: LegionForge/dev-rig/.github/workflows/test.yml@468d5a7c30f6540a472a32d8b3bea1ac381f2017
    with:
      coverage-source: "convobox"
      python-version: "3.12"

  lint:
    name: Lint & Type Check
    uses: LegionForge/dev-rig/.github/workflows/lint.yml@468d5a7c30f6540a472a32d8b3bea1ac381f2017
    with:
      source-dirs: "src/convobox"
      python-version: "3.12"
      # types-PyYAML is the default already; explicit for clarity. mypy's
      # remaining untyped third-party deps (faster-whisper, sounddevice,
      # silero-vad -- no stub packages exist for these) are scoped out via
      # [[tool.mypy.overrides]] in pyproject.toml, not a blanket CLI flag,
      # so this stays real type-checking rather than a broad opt-out.
      extra-mypy-deps: "types-PyYAML"

  sast:
    name: SAST
    uses: LegionForge/dev-rig/.github/workflows/sast.yml@468d5a7c30f6540a472a32d8b3bea1ac381f2017
    permissions:
      contents: read
      security-events: write # required for the CodeQL upload-sarif step inside sast.yml
    with:
      source-dirs: "src/convobox"
      # Restored p/fastapi 2026-08-17: ConvoBox now has a real FastAPI web
      # UI (src/convobox/web/) plus a mounted MCP HTTP server with a CSRF
      # exemption for its own routes -- exactly the trust-boundary code
      # p/fastapi's ruleset targets. dev-rig's default is "p/python
      # p/fastapi"; kept p/security-audit alongside it rather than
      # dropping back to the narrower default.
      semgrep-configs: "p/python p/fastapi p/security-audit"
      python-version: "3.12"

  audit:
    name: Dependency Audit
    uses: LegionForge/dev-rig/.github/workflows/audit.yml@468d5a7c30f6540a472a32d8b3bea1ac381f2017
    with:
      python-version: "3.12"

  sbom:
    name: SBOM
    uses: LegionForge/dev-rig/.github/workflows/sbom.yml@468d5a7c30f6540a472a32d8b3bea1ac381f2017
    with:
      python-version: "3.12"

  secrets:
    name: Secret Scanning
    uses: LegionForge/dev-rig/.github/workflows/secrets.yml@468d5a7c30f6540a472a32d8b3bea1ac381f2017

  process-kill-matrix:
    name: Process-kill matrix (${{ matrix.os }})
    # A local job, NOT a dev-rig `uses:` call -- dev-rig's own test.yml is
    # hardcoded to `runs-on: ubuntu-latest` with no OS-matrix input to opt
    # into (confirmed via `gh api repos/LegionForge/dev-rig/contents/
    # .github/workflows/test.yml`, 2026-08-25), so a real cross-platform
    # OS matrix needs its own job here rather than a dev-rig parameter
    # that doesn't exist. A dev-rig feature request for a real OS-matrix
    # input is the correct long-term home for this -- not filed yet; this
    # job is the achievable-today path.
    #
    # Deliberately narrow: runs ONLY tests/test_backend_adapter_
    # conformance.py and tests/test_real_process_tree_kill.py, not the
    # full suite (already covered, Linux/single-Python, by the `test` job
    # above via dev-rig) -- both need only the `dev` extra (no real audio
    # hardware, no `aec` extra's from-source build), so this stays cheap
    # even tripled across three OSes.
    #
    # Gated to main-branch pushes + manual dispatch, NOT every PR: macOS/
    # Windows GitHub-hosted runners cost meaningfully more per runner-
    # minute than Linux and macOS queues have their own history of
    # flakiness -- the same "heavier than pre-PR" treatment TESTING.md's
    # release gate already gives the mandatory human live-mic UAT pass,
    # applied here to the one thing in this job that's actually
    # automatable across all three platforms.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Backend adapter conformance suite
        run: uv run pytest tests/test_backend_adapter_conformance.py -v

      - name: Real process-tree kill suite
        run: uv run pytest tests/test_real_process_tree_kill.py -v

  safety-phrase-matrix:
    name: Safety-phrase battery (${{ matrix.os }})
    # Continuous cross-platform regression guard for the safety-critical
    # phrase set (safewords/hard-stop, kill_phrase, pause, resume) added
    # 2026-08-26 after docs/field-notes/2026-08-15-safety-phrase-
    # reliability-battery-halt-and-bare-athena-unreliable.md and PR #342
    # showed this project has a real history of individual phrases (e.g.
    # "halt", bare "Athena") turning out unreliable through the real
    # TTS->STT->detector chain despite passing string-level unit tests --
    # a regression here (a phrase becoming unreliable after a TTS/STT
    # engine bump, a detector change, a dependency update) needs the SAME
    # kind of continuous, every-OS check process-kill-matrix above gives
    # process-tree kill reliability, not a one-off manual battery run.
    #
    # Runs scripts/safety_phrase_battery.py, NOT
    # scripts/safety_phrase_battery_live.py: the live variant needs real
    # speakers/a real mic/a real room (and is hardcoded to Linux's
    # wpctl/PipeWire for its volume sweep) -- it stays a human-run, real-
    # hardware check per platform, same tier as the UAT smoke docs. This
    # job's script deliberately removes the audio-hardware confound
    # (synthesizes TTS to an in-memory buffer, decodes it straight back
    # through STT) so it needs only the `dev` extra, same as
    # process-kill-matrix, and is safe and cheap on GitHub-hosted runners
    # with no real audio hardware.
    #
    # Gated identically to process-kill-matrix (push-to-main + manual
    # dispatch, not every PR) for the same reason: macOS/Windows runner-
    # minutes cost more than Linux's, and this isn't needed on every WIP
    # push -- only to catch a real regression once code lands.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Safety-phrase TTS->STT->detector battery
        run: uv run python scripts/safety_phrase_battery.py --repeats 5
