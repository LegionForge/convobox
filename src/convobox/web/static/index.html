<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConvoBox</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --ribbon-bg: #f7f7f8;
    --fg: #1a1a1a;
    --dim: #666666;
    --border: #dddddd;
    --user-bg: #2e7dfb;
    --user-fg: #ffffff;
    --assistant-bg: #f0f0f2;
    --tool-bg: #fff8e1;
    --error-fg: #b00020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --ribbon-bg: #202225;
      --fg: #eaeaea;
      --dim: #999999;
      --border: #3a3a3a;
      --user-bg: #2b5fc7;
      --user-fg: #ffffff;
      --assistant-bg: #2a2a2a;
      --tool-bg: #3a3220;
      --error-fg: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  body { display: flex; flex-direction: column; }

  /* --- Top ribbon: branding, session nav, and controls. Buttons for
     mutating actions (listening/settings/restart) ship disabled -- this
     view is read-only today; wiring them up is a deliberately separate
     follow-up, not silently bundled in with the rendering work. --- */
  .ribbon {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.85rem;
    background: var(--ribbon-bg);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .ribbon img.logo { height: 20px; width: 20px; flex: 0 0 auto; }
  .ribbon .brand { font-size: 0.95rem; font-weight: 600; white-space: nowrap; }
  #status { font-size: 0.75rem; color: var(--dim); white-space: nowrap; }
  #status.connected::before { content: "\25cf"; color: #2e7d32; margin-right: 0.3rem; }
  #status.disconnected::before { content: "\25cf"; color: #c62828; margin-right: 0.3rem; }
  .ribbon .spacer { flex: 1 1 auto; }
  .ribbon select {
    font-size: 0.8rem;
    max-width: 12rem;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.2rem 0.4rem;
  }
  .ribbon button {
    font-size: 0.78rem;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .ribbon button:hover:not(:disabled) { border-color: var(--dim); }
  .ribbon button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* --- Chat: scrollable, mobile-texting-style bubbles. --- */
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #events {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .bubble-row { display: flex; }
  .bubble-row.from-user { justify-content: flex-end; }
  .bubble-row.from-other { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 0.5rem 0.8rem;
    border-radius: 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-row.from-user .bubble { border-bottom-right-radius: 4px; }
  .bubble-row.from-other .bubble { border-bottom-left-radius: 4px; }
  .bubble .meta {
    font-size: 0.68rem;
    opacity: 0.7;
    margin-bottom: 0.2rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .bubble.transcript { background: var(--user-bg); color: var(--user-fg); }
  .bubble.response { background: var(--assistant-bg); }
  .bubble.tool_call, .bubble.tool_result {
    background: var(--tool-bg);
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
  }
  .bubble.approval_request { background: var(--assistant-bg); border: 1px solid #e0a030; }
  .bubble.error { background: var(--assistant-bg); color: var(--error-fg); }
  #empty { color: var(--dim); text-align: center; padding: 2rem; }

  /* --- Approval actions: a non-voice equivalent of saying the approval
     phrase / "no" / "explain" out loud. Text labels carry the meaning
     (never color alone -- WCAG 1.4.1); the accent border colors below are
     an extra cue only, and deliberately blue/orange rather than
     green/red, the collision pair most likely to look identical to
     red-green colorblind users. --- */
  .approval-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.6rem;
  }
  .approval-actions button {
    font-size: 0.8rem;
    min-height: 44px;
    min-width: 44px;
    padding: 0.3rem 0.9rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .approval-actions button:hover:not(:disabled) { border-color: var(--dim); }
  .approval-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .approval-actions .approve-btn { border-color: #1a56db; }
  .approval-actions .deny-btn { border-color: #c2540a; }
  .approval-note { margin-top: 0.4rem; font-size: 0.75rem; opacity: 0.85; }
</style>
</head>
<body>
<header class="ribbon">
  <img class="logo" src="img/legionforge-logo.svg" alt="LegionForge">
  <span class="brand">ConvoBox</span>
  <span id="status" class="disconnected">connecting&hellip;</span>
  <span class="spacer"></span>
  <select id="session-select"></select>
  <button id="clear-history-btn" title="Clear this session's history">Clear history</button>
  <button disabled title="Coming soon">Stop listening</button>
  <button disabled title="Coming soon">Settings</button>
</header>
<main>
  <div id="events">
    <div id="empty">No events yet.</div>
  </div>
</main>
<script>
(function () {
  "use strict";

  const eventsEl = document.getElementById("events");
  const emptyEl = document.getElementById("empty");
  const statusEl = document.getElementById("status");
  const sessionSelect = document.getElementById("session-select");
  const clearHistoryBtn = document.getElementById("clear-history-btn");
  let currentSessionId = null;

  // transcript (the user's own speech) renders on the right, like an
  // outgoing text message; everything else (assistant response, tool
  // calls/results, approval requests, errors) renders on the left. "done"
  // is a turn-boundary marker only, never its own bubble.
  function side(kind) {
    return kind === "transcript" ? "from-user" : "from-other";
  }

  // The button-row for whichever approval_request is currently the live
  // one to answer, or null if none. Only one approval can be pending on
  // the backend at a time (a single process-wide ApprovalPromptGate), but
  // bubbles are append-only and never removed -- without this, an OLDER
  // approval's still-enabled buttons would stay clickable in the DOM
  // after a NEWER request replaced it, and clicking them would wrongly
  // act on the newer, unrelated request (the backend endpoint has no way
  // to tell "this click meant the old one").
  let pendingApprovalActions = null;

  function disableApprovalActions(row, message) {
    if (!row) return;
    row.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    let note = row.querySelector(".approval-note");
    if (!note) {
      note = document.createElement("div");
      note.className = "approval-note";
      note.setAttribute("role", "status");
      row.appendChild(note);
    }
    note.textContent = message;
  }

  function buildApprovalActions() {
    const row = document.createElement("div");
    row.className = "approval-actions";

    async function send(action) {
      row.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      let res, data;
      try {
        res = await fetch(`/api/sessions/${encodeURIComponent(currentSessionId)}/approval`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action }),
        });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        console.error("approval action failed", err);
        row.querySelectorAll("button").forEach((b) => { b.disabled = false; });
        return;
      }
      if (!res.ok) {
        // Most likely: already resolved by voice, or it timed out, between
        // this bubble rendering and the click landing -- surface that
        // plainly and lock the stale controls rather than leaving them
        // clickable with no explanation (lessons-ui-ux.md: a failed action
        // must say what happened, not fail silently).
        disableApprovalActions(row, data.detail || "Could not resolve -- it may have already been answered another way.");
        if (pendingApprovalActions === row) pendingApprovalActions = null;
        return;
      }
      if (action === "explain") {
        row.querySelectorAll("button").forEach((b) => { b.disabled = false; });
        let note = row.querySelector(".approval-note");
        if (!note) {
          note = document.createElement("div");
          note.className = "approval-note";
          note.setAttribute("role", "status");
          row.appendChild(note);
        }
        note.textContent = data.explanation ? `Kept open: ${data.explanation}` : "Kept open -- timeout reset.";
        return;
      }
      disableApprovalActions(row, action === "approve" ? "Approved." : "Denied.");
      if (pendingApprovalActions === row) pendingApprovalActions = null;
    }

    const specs = [
      ["approve-btn", "Approve", "Runs the pending command now — the same effect as saying the approval phrase out loud.", "Approve the pending command"],
      ["deny-btn", "Deny", "Blocks the pending command — the same effect as saying “no” out loud.", "Deny the pending command"],
      ["explain-btn", "Explain", "Keeps this request open and resets its timeout, so it won’t auto-deny while you read the detail above.", "Keep this request open and show its full detail"],
    ];
    for (const [cls, label, title, ariaLabel] of specs) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = cls;
      btn.textContent = label;
      btn.title = title;
      btn.setAttribute("aria-label", ariaLabel);
      btn.addEventListener("click", () => send(label.toLowerCase()));
      row.appendChild(btn);
    }
    return row;
  }

  function renderEvent(ev) {
    const kind = ev.event_type || ev.type || "event";
    if (kind === "done") return;
    if (emptyEl.parentNode) emptyEl.remove();

    const row = document.createElement("div");
    row.className = "bubble-row " + side(kind);

    const bubble = document.createElement("div");
    bubble.className = "bubble " + kind;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = kind.replace(/_/g, " ");
    bubble.appendChild(meta);

    const body = document.createElement("div");
    // textContent, never innerHTML -- transcripts/tool output/backend
    // responses are untrusted content (docs/WEB-UI-ARCHITECTURE.md's own
    // XSS-prevention note), so no HTML in them is ever interpreted.
    body.textContent =
      ev.backend_response || ev.content || ev.user_transcript ||
      (ev.tool_name ? `${ev.tool_name}(${ev.tool_input || ""})` : "") ||
      (ev.tool_output || "");
    bubble.appendChild(body);

    if (kind === "approval_request") {
      if (pendingApprovalActions) {
        disableApprovalActions(pendingApprovalActions, "Superseded by a newer request.");
      }
      const actions = buildApprovalActions();
      bubble.appendChild(actions);
      pendingApprovalActions = actions;
    }

    row.appendChild(bubble);
    eventsEl.appendChild(row);
    row.scrollIntoView({ block: "end" });
  }

  // Per-role bubble color overrides (convobox.yaml's display.user_color /
  // display.assistant_color, set via scripts/settings_tui.py). Setting
  // these as inline styles on the root element outranks the @media
  // (prefers-color-scheme: dark) block's :root rule regardless of the
  // system theme, so an operator-chosen color applies consistently in
  // both light and dark mode rather than needing a pair per theme.
  async function loadDisplayConfig() {
    try {
      const res = await fetch("/api/config");
      const data = await res.json();
      if (data.user_color) document.documentElement.style.setProperty("--user-bg", data.user_color);
      if (data.assistant_color) document.documentElement.style.setProperty("--assistant-bg", data.assistant_color);
    } catch (err) {
      console.error("failed to load display config", err);
    }
  }

  async function loadSessions() {
    const res = await fetch("/api/sessions");
    const data = await res.json();
    sessionSelect.innerHTML = "";
    for (const s of data.sessions) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = `${s.id} (${s.last_activity})`;
      sessionSelect.appendChild(opt);
    }
    return data.sessions[0] ? data.sessions[0].id : null;
  }

  async function loadHistory(sessionId) {
    currentSessionId = sessionId || null;
    pendingApprovalActions = null;
    if (!sessionId) return;
    const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/events`);
    const data = await res.json();
    eventsEl.innerHTML = "";
    if (data.events.length === 0) {
      eventsEl.appendChild(emptyEl);
      return;
    }
    for (const ev of data.events) renderEvent(ev);
  }

  function connectStream() {
    const source = new EventSource("/api/events/stream");
    source.onopen = () => {
      statusEl.textContent = "live";
      statusEl.className = "connected";
    };
    source.onerror = () => {
      statusEl.textContent = "reconnecting…";
      statusEl.className = "disconnected";
    };
    source.onmessage = (e) => {
      try {
        renderEvent(JSON.parse(e.data));
      } catch (err) {
        console.error("bad SSE payload", err);
      }
    };
    return source;
  }

  sessionSelect.addEventListener("change", () => loadHistory(sessionSelect.value));

  clearHistoryBtn.addEventListener("click", async () => {
    if (!currentSessionId) return;
    await fetch(`/api/sessions/${encodeURIComponent(currentSessionId)}/clear`, { method: "POST" });
    await loadHistory(currentSessionId);
  });

  (async function init() {
    await loadDisplayConfig();
    const latest = await loadSessions();
    await loadHistory(latest);
    connectStream();
  })();
})();
</script>
</body>
</html>
