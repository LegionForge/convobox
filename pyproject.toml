[project]
name = "legionforge-convobox"
version = "0.4.0"
description = "Local, backend-agnostic voice frontend for CLI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "JP Cruz", email = "jp@legionforge.org" },
]
# "3 - Alpha" is accurate, not aspirational: pre-PyPI-publish, early/active
# development. Only claims the Python version this project actually tests
# against (requires-python's own floor, and lint.yml's CI matrix) -- no
# 3.13/3.14 classifier without that being true.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "voice-assistant",
    "speech-to-text",
    "text-to-speech",
    "claude-code",
    "codex",
    "opencode",
    "coding-agent",
    "cli",
]
dependencies = [
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "silero-vad>=5.1",
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/LegionForge/convobox"
Repository = "https://github.com/LegionForge/convobox"
Issues = "https://github.com/LegionForge/convobox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    # Upper-bounded, unlike the others here: CI's lint job (LegionForge/
    # dev-rig's lint.yml) installs via `pip install -e ".[dev]"`, which does
    # NOT read this repo's uv.lock -- so an unbounded ruff dependency here
    # means the next ruff release can silently start enforcing new
    # default-on rules in CI while every local `uv run ruff` (pinned to
    # uv.lock's exact version) stays green and shows nothing wrong.
    # Live-confirmed 2026-07-24: 0.15.21 (uv.lock) -> 0.16.0 (latest on
    # PyPI at the time) added RUF022/G201/SIM102/PIE808/etc, breaking CI's
    # lint job on `main` while every local run passed. Re-verify against
    # the new version's diff before bumping this bound.
    "ruff>=0.15,<0.17",
    "bandit>=1.9",
]
# Acoustic echo cancellation (WebRTC APM, BSD-3). A separate extra, NOT
# part of dev: PyPI only ships prebuilt wheels for Windows, and CI's Linux
# runners must keep installing cleanly. Code paths degrade gracefully
# without it (audio.echo_cancellation defaults off; enabling it without
# the package raises with install instructions). AEC tests skip when it's
# absent.
#
# macOS: the sdist's build system already supports Darwin (meson build of
# the webrtc-audio-processing dylib, -DWEBRTC_MAC flags, ARM64 NEON) --
# verified 2026-07-16 on Apple Silicon. It just needs build tools uv/pip
# won't install for you: `brew install meson ninja swig`, then
# `uv pip install --no-binary aec-audio-processing aec-audio-processing`.
# See docs/KNOWN-ISSUES.md for the full note.
aec = [
    "aec-audio-processing>=1.0",
]
# GPU inference for faster-whisper (stt.device: cuda/auto). ctranslate2's
# Windows wheel bundles cuDNN directly (site-packages/ctranslate2/cudnn64_9.dll)
# but NOT cuBLAS/nvrtc/the CUDA runtime -- without this extra, `stt.device:
# cuda` constructs fine (device selection is separate from library loading)
# but the first real .transcribe() call fails with "Library cublas64_12.dll
# is not found or cannot be loaded" (live-confirmed, 2026-07-20). Installing
# this extra alone is NOT sufficient -- convobox.stt.transcriber's own
# _register_cuda_dll_directories() must also put these packages' bin/
# directories on PATH at import time (live-confirmed both are needed,
# 2026-07-22); see that function's docstring. A separate extra, not part
# of dev/aec: these wheels are large (~1GB) and CUDA-only, no benefit on
# CPU-only machines or CI's Linux runners.
cuda = [
    "nvidia-cublas-cu12>=12.0",
    "nvidia-cuda-nvrtc-cu12>=12.0",
    "nvidia-cuda-runtime-cu12>=12.0",
]
# piper-tts is GPL-3.0 (see DEPENDENCY_LICENSE_AUDIT.md) and deliberately
# NOT in the main dependencies list, so a plain `uv sync`/`pip install .`
# never pulls in GPL-licensed code — only an explicit, separate opt-in
# (`uv sync --extra piper`) does. Kokoro (kokoro-onnx, MIT + Apache-2.0
# model weights) is the default engine.
piper = [
    "piper-tts>=1.2",
]
# The local web UI (docs/WEB-UI-ARCHITECTURE.md): a FastAPI app that streams
# live events over SSE and serves history from SQLite (stdlib, no extra
# needed). A separate extra, not part of the main dependencies, since most
# CLI/TUI-only users never need a web server or its dependency footprint.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Required by FastAPI/Starlette to parse multipart/form-data (the drag-
    # and-drop file upload endpoint, /api/upload) -- not a transitive
    # dependency of fastapi itself, has to be listed explicitly or upload
    # requests fail at request time with a RuntimeError, not at import time.
    "python-multipart>=0.0.9",
    # The "show this document" tool the backend agent can call to refocus
    # the artifact pane (src/convobox/web/mcp_server.py) -- the official
    # SDK, not hand-rolled JSON-RPC/SSE framing, since correctness here is
    # judged against a real external client (claude/codex's own MCP
    # client), not just ConvoBox's own tests.
    # Upper-bounded (2026-09-01, GitHub security review's supply-chain
    # finding, confirmed by reproducing it): mcp 2.1.1 changes ToolError's
    # message wrapping (every raised error now reads "Error executing
    # tool show_document" instead of surfacing the real message), which
    # breaks 3 of test_web_mcp_server.py's own tests that match on the
    # underlying message text. uv.lock already pins 2.0.0, so this only
    # protects a fresh resolve that bypasses the lock (`pip install`
    # without `--frozen`, a new contributor's first `uv sync` after the
    # lock ever drifts, etc.) -- same class of risk this repo already
    # fixed once for ruff (see that dependency's own comment).
    "mcp>=1.0,<2.1",
]
# Post-hoc plotting for scripts/analyze_incident.py (saved
# --capture-incidents / --aec-dump WAVs). Plotting only -- never imported
# by the running product -- so kept out of dev/aec rather than pulling a
# GUI-adjacent plotting stack into every install.
analysis = [
    "matplotlib>=3.8",
]
# Windows-only system output volume control (pycaw wraps the Core Audio
# IAudioEndpointVolume COM interface) for scripts/acoustic_calibration.py's
# --volume-candidates sweep (GitHub issue #119 follow-up: automate the
# amplitude axis the 2026-08-11 macOS volume sweep did by hand). A separate
# extra: Windows-only wheel, never imported by the running product, only
# needed when actually running an amplitude sweep.
calibration = [
    "pycaw>=20230407; sys_platform == 'win32'",
]

[project.scripts]
convobox = "scripts.run_convobox:main"
convobox-spike = "scripts.spike:main"
convobox-settings = "scripts.settings_tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Live-verified, 2026-08-03: without "scripts" here, `pip install convobox`
# from the built wheel left every [project.scripts] entry point broken
# (ModuleNotFoundError: No module named 'scripts') -- the scripts/ package
# was present in the sdist but never made it into the wheel, the thing
# pip actually installs from. scripts.run_convobox/settings_tui/spike are
# real first-party modules (not build tooling), they just live outside
# src/convobox for historical reasons (standalone-run via `python
# scripts/foo.py`, predating packaging as installable entry points).
packages = ["src/convobox", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Every standalone script under scripts/ inserts src/ (and, for a few,
# scripts/ itself) onto sys.path before importing convobox.* -- necessary
# because these run directly (python scripts/foo.py), not through the
# installed package, and each does this deliberately and visibly (see the
# comment at each insert site), not by accident.
"scripts/*.py" = ["E402"]

[tool.mypy]
# Pinned rather than left at its "defaults to sys.platform" behavior (D1,
# the 2026-08-08 review): CI (dev-rig's lint.yml) runs on Linux, but
# scripts/run_convobox.py has genuinely POSIX-only code (the TUI's raw-mode
# terminal restore, gated behind `if sys.platform != "win32":` well before
# it's used -- see tui_old_tty_settings). A contributor running plain
# `mypy src/convobox scripts` on Windows would otherwise get 3 extra,
# CI-invisible "Module has no attribute" errors on that termios call
# (confirmed live: identical to CI's actual result once `--platform linux`
# is passed explicitly) -- not a real bug, just a local platform mismatch
# that made local runs untrustworthy against what CI actually checks.
platform = "linux"

[[tool.mypy.overrides]]
# faster-whisper, sounddevice, and silero-vad ship no type stubs and no
# py.typed marker -- no stub package exists to install for them (unlike
# PyYAML, whose types-PyYAML stub package is a lint.yml default input).
# Scoped here rather than a blanket --ignore-missing-imports CLI flag so
# every other import stays checked; this is what makes plain `mypy
# src/convobox scripts` (dev-rig's lint.yml invocation -- see D1, the
# 2026-08-08 review, for why scripts/ is now part of that invocation too,
# not just src/convobox) pass, matching what
# `mypy ... --ignore-missing-imports` already did for the whole tree.
#
# aec_audio_processing, piper/piper.*, fastapi/starlette/uvicorn/mcp, and
# matplotlib are a different reason for the same fix: all are opt-in
# extras (`uv sync --extra aec`/`--extra piper`/`--extra web`/
# `--extra analysis`) deliberately NOT installed by CI's default lint job
# (see DEPENDENCY_LICENSE_AUDIT.md for why piper-tts specifically must
# stay opt-in, not default -- it's GPL-3.0; web's own reason is
# pyproject.toml's own comment on the `web` extra; matplotlib's is the
# `analysis` extra's own comment -- plotting-only, scripts/
# analyze_incident.py's --plot flag, never imported by the running
# product), so mypy can never resolve them there regardless of whether
# stubs exist upstream.
#
# voice_picker/audio_devices/_console/run_convobox are a third reason
# again: real first-party modules (scripts/voice_picker.py,
# scripts/audio_devices.py, scripts/_console.py, scripts/run_convobox.py),
# but other scripts/ modules import them the same way each runs
# standalone -- a bare `import voice_picker` relying on a runtime sys.path
# insert, not `from scripts import voice_picker` -- so even with scripts/
# now included, mypy still resolves each such module independently rather
# than seeing them as siblings on a shared search path. voice_picker/
# audio_devices were only surfaced once something under src/convobox
# first imported settings_tui.py (web/settings_api.py, web UI v2 slice 3)
# and mypy started following it; _console/run_convobox are the same
# pattern, surfaced by scripts/ itself joining this invocation (D1).
module = [
    "faster_whisper",
    "faster_whisper.*",
    "sounddevice",
    "silero_vad",
    "silero_vad.*",
    "aec_audio_processing",
    "piper",
    "piper.*",
    "fastapi",
    "fastapi.*",
    "starlette",
    "starlette.*",
    "uvicorn",
    "uvicorn.*",
    "mcp",
    "mcp.*",
    "matplotlib",
    "matplotlib.*",
    "voice_picker",
    "audio_devices",
    "_console",
    "run_convobox",
]
ignore_missing_imports = true

[tool.bandit]
# Test asserts are pytest's own verification mechanism (not a runtime
# invariant that -O could silently strip away), which is why bandit's own
# B101 rule is the wrong lens for tests/ specifically -- CI (dev-rig
# lint.yml) is invoked with source-dirs=src/convobox for exactly this
# reason; this exclude just keeps a local `bandit -r .` from being
# swamped by the same non-finding.
exclude_dirs = ["tests"]
