name: Publish to PyPI

# Triggered by pushing a version tag (e.g. git tag v0.4.0 && git push --tags).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in secrets.
# Configure the trusted publisher at https://pypi.org/manage/project/legionforge-convobox/settings/
# before pushing the first tag:
#   Publisher: GitHub Actions
#   Repository: LegionForge/convobox
#   Workflow: publish.yml
#   Environment: pypi
#
# PyPI distribution name is legionforge-convobox (org convention: PyPI is a
# flat global namespace, so every LegionForge package is prefixed to avoid
# squatting/ambiguity -- see LegionForge/convobox's own DEPENDENCY_LICENSE_AUDIT.md
# and pyproject.toml `[project] name`). The repo name, import path, and CLI
# commands (convobox/convobox-settings/convobox-spike) stay unprefixed.
#
# Template: LegionForge/llm-valet/.github/workflows/publish.yml, adapted to
# this repo's actual Python floor (3.12, matching pyproject.toml's
# requires-python and ci.yml's python-version -- not copied blindly from
# llm-valet's 3.11).
#
# Every action below is pinned to a commit SHA, not a floating tag --
# same discipline ci.yml already applies to dev-rig (see that file's own
# comment on why a moved tag is a real supply-chain vector), just not
# consistently carried over here when this file was first written.
# pypa/gh-action-pypi-publish's `release/v1` ref is a BRANCH, not a tag --
# more mutable than a normal version tag, not less, so pinning matters
# even more for it. Resolved 2026-08-06:
#   actions/checkout@v7                  -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python@v6              -> ece7cb06caefa5fff74198d8649806c4678c61a1
#   actions/upload-artifact@v7           -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact@v8         -> 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   pypa/gh-action-pypi-publish@release/v1 -> dc37677b2e1c63e2034f94d8a5b11f265b73ba33

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  smoke-test:
    name: Smoke-test the built wheel
    # Live-verified 2026-08-03 (pyproject.toml's own [tool.hatch.build.
    # targets.wheel] comment): a built wheel once shipped with every
    # [project.scripts] entry point broken (scripts/ missing from the
    # wheel, ModuleNotFoundError at runtime) despite every editable-
    # checkout test passing -- editable installs resolve src/convobox and
    # scripts/ directly off the filesystem, so they can't catch a
    # packaging-manifest gap between them. This job is the guard: install
    # the actual built wheel into an isolated environment and prove the
    # things editable tests structurally cannot -- that the distribution
    # PyPI is about to receive actually has working entry points and its
    # bundled web static assets, before publish runs.
    #
    # Deliberately no `actions/checkout` here: this job never needs the
    # repo's source tree, only the built dist/ artifact -- checking out
    # the repo alongside it would risk `import convobox` accidentally
    # resolving against a stray src/convobox on the path instead of the
    # installed wheel, which is exactly the false-confidence editable
    # installs already give every other test run. Steps also `cd` to a
    # neutral directory before running anything, so cwd itself can't
    # matter either.
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the built wheel (no extras -- entry points and
          static assets need neither live audio nor a backend login)
        run: pip install dist/*.whl

      - name: CLI entry points actually run
        working-directory: ${{ runner.temp }}
        run: |
          convobox --version
          convobox --help
          convobox-settings --help
          convobox-audio-devices --help
          convobox-spike --help

      - name: Bundled web static assets are actually packaged
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import importlib.resources as r
          p = r.files('convobox.web') / 'static' / 'index.html'
          assert p.is_file(), f'packaged index.html missing: {p}'
          print(f'OK: {p} ({p.stat().st_size} bytes)')
          "

  publish:
    name: Publish to PyPI
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
