<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConvoBox</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<!-- highlight.js themes, vendored (see vendor/highlightjs/NOTICE.md) --
     only the one matching the OS color-scheme preference actually
     applies, same mechanism the rest of this page's own dark/light
     theming already uses (:root's own prefers-color-scheme block
     above). Loaded unconditionally (small, ~1.3KB each) even though the
     JS highlighter itself only loads on demand -- see renderArtifact(). -->
<link rel="stylesheet" href="vendor/highlightjs/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/highlightjs/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --ribbon-bg: #f7f7f8;
    --fg: #1a1a1a;
    --dim: #666666;
    --border: #dddddd;
    --user-bg: #2e7dfb;
    --user-fg: #ffffff;
    --assistant-bg: #f0f0f2;
    --tool-bg: #fff8e1;
    --error-fg: #b00020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --ribbon-bg: #202225;
      --fg: #eaeaea;
      --dim: #999999;
      --border: #3a3a3a;
      --user-bg: #2b5fc7;
      --user-fg: #ffffff;
      --assistant-bg: #2a2a2a;
      --tool-bg: #3a3220;
      --error-fg: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  body { display: flex; flex-direction: column; }

  /* Screen-reader-only label text -- visually hidden but still in the
     accessibility tree, for controls (like the session picker below)
     where a visible <label> doesn't fit this ribbon's compact layout.
     Prefer a real <label> over aria-label alone wherever there's room
     for one, even an off-screen one. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* --- Top ribbon: branding, session nav, and controls. Stop/Resume
     listening, Settings, and Quit are all real control-plane actions now
     (each a deliberate, separately-confirmed extension of the no-auth
     loopback trust model -- see docs/WEB-UI-USAGE.md's security
     section). Only restart-on-demand remains unbuilt. --- */
  .ribbon {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.85rem;
    background: var(--ribbon-bg);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .ribbon img.logo { height: 20px; width: 20px; flex: 0 0 auto; }
  .ribbon .brand { font-size: 0.95rem; font-weight: 600; white-space: nowrap; }
  #status { font-size: 0.75rem; color: var(--dim); white-space: nowrap; }
  #status.connected::before { content: "\25cf"; color: #2e7d32; margin-right: 0.3rem; }
  #status.disconnected::before { content: "\25cf"; color: #c62828; margin-right: 0.3rem; }
  /* The mic loop's own activity (listening/capturing/speaking/working/
     waiting/paused) -- same vocabulary the TUI's status line already
     used, now also broadcast to the web UI (see forward_status in
     src/convobox/web/bridge.py). Text-only, no color coding -- these
     aren't states that need an alarm color, just an at-a-glance label. */
  #activity-status { font-size: 0.75rem; color: var(--dim); white-space: nowrap; }
  #activity-status:empty { display: none; }
  #activity-status.paused { color: #e0a030; font-weight: 600; }
  .ribbon .spacer { flex: 1 1 auto; }
  .ribbon select {
    font-size: 0.8rem;
    max-width: 12rem;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.2rem 0.4rem;
  }
  .ribbon button {
    font-size: 0.78rem;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .ribbon button:hover:not(:disabled) { border-color: var(--dim); }
  .ribbon button:disabled { opacity: 0.45; cursor: not-allowed; }
  /* Armed = primed to actually quit on the next click. A distinct fill
     color plus the text itself changing ("Click again to quit") -- never
     color alone (WCAG 1.4.1), same rule as everywhere else in this file.
     A fixed #b00020 in both themes, not --error-fg (dark mode's #ff6b6b
     is tuned as TEXT on a dark background, not as a fill under WHITE
     text -- that pairing falls well short of the 4.5:1 minimum). */
  .ribbon button.quit-btn.armed {
    background: #b00020;
    border-color: #b00020;
    color: #ffffff;
  }
  /* Stop button: always red, no arm/confirm step -- it mirrors the spoken
     safeword ("stop stop stop"), which also acts on the first utterance,
     not a two-step confirm. Same fixed #b00020/white pairing as quit-btn's
     armed state (chosen there for the same 4.5:1-contrast reason). */
  .ribbon button.stop-btn {
    background: #b00020;
    border-color: #b00020;
    color: #ffffff;
  }
  .ribbon button.stop-btn:hover:not(:disabled) {
    background: #8f0019;
    border-color: #8f0019;
  }
  /* Decorative only (aria-hidden) -- the button's own text/aria-label
     already carries the real accessible name and state (WCAG 1.1.1: a
     glyph is never the sole carrier of meaning). Purely a faster visual
     at-a-glance cue for sighted users switching between "click to pause"
     and "click to resume". */
  #listening-btn-icon { margin-right: 0.3em; }

  /* --- Row below the ribbon: chat on the left, the artifact pane (when
     open) on the right. min-height: 0 on both the row and its scrolling
     children is required for a flex child to actually scroll instead of
     stretching its parent -- a well-known flexbox gotcha, not optional
     here since both panes independently scroll their own content. --- */
  .body-row {
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    min-height: 0;
  }

  /* --- Chat: scrollable, mobile-texting-style bubbles, with a fixed
     composer bar below (not part of the scrolling area -- see
     #events-scroll). --- */
  main {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #events-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
  /* --- Drag-and-drop upload overlay: covers the chat area (not the
     composer, so it stays visibly usable/droppable-adjacent) while a
     drag is in progress. pointer-events: none so the overlay itself
     never intercepts the drop -- main's own dragover/drop listeners
     handle it (see the drag-depth-counter note in the script below for
     why a plain dragenter/dragleave pair isn't enough). --- */
  #drop-overlay {
    position: absolute;
    inset: 0;
    bottom: 3.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    text-align: center;
    background: rgba(46, 125, 251, 0.12);
    border: 2px dashed var(--user-bg);
    border-radius: 8px;
    margin: 0.4rem;
    color: var(--fg);
    font-size: 0.95rem;
    font-weight: 600;
    pointer-events: none;
    z-index: 5;
  }
  #drop-overlay[hidden] { display: none; }
  #events {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .bubble-row { display: flex; }
  .bubble-row.from-user { justify-content: flex-end; }
  .bubble-row.from-other { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 0.5rem 0.8rem;
    border-radius: 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-row.from-user .bubble { border-bottom-right-radius: 4px; }
  .bubble-row.from-other .bubble { border-bottom-left-radius: 4px; }
  .bubble .meta {
    font-size: 0.68rem;
    opacity: 0.7;
    margin-bottom: 0.2rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .bubble.transcript { background: var(--user-bg); color: var(--user-fg); }
  .bubble.response { background: var(--assistant-bg); }
  .bubble.tool_call, .bubble.tool_result {
    background: var(--tool-bg);
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
  }
  /* Tool call/result bodies default to collapsed (a busy tool-using turn
     can otherwise dump a wall of raw input/output into the transcript) --
     <details>/<summary> gets click-to-expand, keyboard access, and the
     disclosure triangle for free, no custom JS state needed. */
  .bubble.tool_call summary, .bubble.tool_result summary {
    cursor: pointer;
  }
  .bubble.tool_call summary:hover, .bubble.tool_result summary:hover {
    opacity: 0.8;
  }
  .tool-detail {
    margin-top: 0.4rem;
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0.9;
  }
  .bubble.approval_request { background: var(--assistant-bg); border: 1px solid #e0a030; }
  .bubble.error { background: var(--assistant-bg); color: var(--error-fg); }
  #empty { color: var(--dim); text-align: center; padding: 2rem; }

  /* --- Composer: the web UI's typed-text equivalent of a spoken
     transcript (POST /api/text) -- goes through the same corrections +
     Orchestrator.handle_transcript() path --text mode already uses,
     src/convobox/web/bridge.py's WebTextInputBridge. --- */
  #composer {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--ribbon-bg);
  }
  #composer-input {
    flex: 1 1 auto;
    resize: none;
    min-height: 2.3rem;
    max-height: 8rem;
    padding: 0.5rem 0.7rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-size: 0.9rem;
  }
  #composer-send-btn {
    flex: 0 0 auto;
    font-size: 0.85rem;
    padding: 0.55rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  #composer-send-btn:hover:not(:disabled) { border-color: var(--dim); }
  #composer-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* --- Approval actions: a non-voice equivalent of saying the approval
     phrase / "no" / "explain" out loud. Text labels carry the meaning
     (never color alone -- WCAG 1.4.1); the accent border colors below are
     an extra cue only, and deliberately blue/orange rather than
     green/red, the collision pair most likely to look identical to
     red-green colorblind users. --- */
  .approval-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.6rem;
  }
  .approval-actions button {
    font-size: 0.8rem;
    min-height: 44px;
    min-width: 44px;
    padding: 0.3rem 0.9rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .approval-actions button:hover:not(:disabled) { border-color: var(--dim); }
  .approval-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .approval-actions .approve-btn { border-color: #1a56db; }
  .approval-actions .deny-btn { border-color: #c2540a; }
  .approval-note { margin-top: 0.4rem; font-size: 0.75rem; opacity: 0.85; }

  /* --- Artifact pane: opens on the right when a tool call produces
     something worth looking at (docs/ARTIFACT-PANE-SCOPE.md). Closed by
     default (hidden), v1 scope: one pane, latest artifact only -- a
     later ARTIFACT event (same path or a different one) replaces this
     pane's content rather than opening a second pane or keeping a
     history/gallery. Image/HTML rendering only; everything else in the
     serving route's own allowlist (pdf/csv/txt) falls back to a plain
     download link, not a bespoke viewer. --- */
  #artifact-pane {
    /* flex-basis is deliberately "auto" (via "0 0 auto", NOT a fixed
       value like the old "0 0 min(420px, 40vw)") -- a flex item's
       explicit flex-basis overrides `width` entirely on the main axis,
       which would make a JS-driven inline `width` write silently do
       nothing. With flex-basis: auto, `width` below supplies the
       initial size AND stays live as the resize handle overwrites it
       via inline style (inline always wins over this stylesheet rule).
       Confirmed live: the "0 0 min(...)" version accepted a manual
       style.width write with zero visible effect. */
    flex: 0 0 auto;
    width: min(420px, 40vw);
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--ribbon-bg);
    min-width: 240px;
    max-width: 85vw;
    position: relative;
  }
  #artifact-pane[hidden] { display: none; }
  /* Resize handle: a custom JS-driven drag strip straddling the pane's
     LEFT border, not CSS `resize` (tried first, reverted -- this pane
     is always the last flex item, docked flush against the BROWSER
     WINDOW'S own right edge with zero px of slack past it. The native
     `resize` handle renders at an element's bottom-RIGHT corner, so
     "drag right to widen" has nowhere to go: the cursor hits the window
     edge after ~1-2px, structurally regardless of screen size or
     zoom -- live-confirmed (viewport width == pane's own right edge to
     the pixel). Shrinking "worked" only because dragging LEFT, into the
     page, has normal room; the same handle could never widen the pane
     in this docked layout. A left-edge handle has no such problem --
     both directions drag into open space (the chat pane shrinking/
     growing on one side, nothing constraining the other). */
  #artifact-resize-handle {
    position: absolute; left: -4px; top: 0; bottom: 0; width: 9px;
    cursor: col-resize; z-index: 5; touch-action: none;
  }
  #artifact-resize-handle:hover, #artifact-resize-handle.dragging {
    background: linear-gradient(to right, transparent 3px, var(--dim) 3px 5px, transparent 5px);
    opacity: 0.8;
  }
  .artifact-pane-header {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .artifact-pane-header span {
    font-size: 0.8rem; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto;
  }
  .artifact-pane-header button {
    font-size: 1.1rem; line-height: 1; background: none; border: none;
    color: var(--fg); cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 6px;
    flex: 0 0 auto;
  }
  .artifact-pane-header button:hover { background: var(--assistant-bg); }
  #artifact-pane-editor-link {
    font-size: 0.72rem; color: var(--fg); text-decoration: none;
    padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid var(--border);
    flex: 0 0 auto; white-space: nowrap;
  }
  #artifact-pane-editor-link:hover { border-color: var(--dim); }
  #artifact-pane-editor-link[hidden] { display: none; }
  #artifact-pane-body {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    display: flex;
    padding: 0.8rem;
  }
  /* Center content that fits, WITHOUT clipping content that doesn't.
     align-items/justify-content: center on the container (the old rule)
     centers the scrollable range itself around the content's midpoint,
     which for anything wider/taller than the pane makes half the
     overflow permanently unreachable by scrolling no matter how far the
     pane is resized -- live-confirmed: a wide artifact rendered with
     ~13000px of content had ~6700px of scrollable range, i.e. the left
     half was never reachable. margin: auto on the child is the standard
     fix -- it absorbs free space (so small content still centers) but
     collapses to 0 rather than going negative once the item is bigger
     than the container, leaving the item flush at the scroll origin
     with its FULL extent inside the scrollable range. */
  #artifact-pane-body > * { margin: auto; }
  #artifact-pane-body img {
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  #artifact-pane-body iframe {
    width: 100%; height: 100%; border: 1px solid var(--border);
    border-radius: 6px; background: #fff;
  }
  #artifact-pane-body a.artifact-fallback-link {
    color: var(--fg); font-size: 0.85rem;
  }

  /* --- Artifact Chooser: a tab strip across the top of the pane, one tab
     per artifact this session has produced (docs/ARTIFACT-PANE-SCOPE.md's
     "Artifact Chooser" section). Horizontal scroll on overflow, never
     wraps -- wrapping would eat vertical space from the artifact itself. */
  #artifact-tabs {
    display: flex; flex: 0 0 auto; overflow-x: auto; overflow-y: hidden;
    border-bottom: 1px solid var(--border);
  }
  #artifact-tabs[hidden] { display: none; }
  .artifact-tab {
    flex: 0 0 auto; max-width: 140px; padding: 0.4rem 0.7rem;
    font-size: 0.72rem; background: none; border: none;
    border-bottom: 2px solid transparent; color: var(--dim);
    cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .artifact-tab:hover { background: var(--assistant-bg); color: var(--fg); }
  .artifact-tab.active {
    color: var(--fg); border-bottom-color: var(--fg); font-weight: 600;
  }

  /* --- Working-directory file browser: a filtered, flat list of files in
     backend.working_dir (docs/ARTIFACT-PANE-SCOPE.md's "Working-Directory
     File Browser" section) -- only ever files whose extension is already
     in the artifact-serving allowlist, no dotfiles/symlinks. The trigger
     button itself is a plain ribbon button (styled by .ribbon button,
     same as Settings/Quit/etc. next to it) -- only the modal needs its
     own rules. --- */
  .artifact-browse-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem; z-index: 100;
  }
  .artifact-browse-overlay[hidden] { display: none; }
  .artifact-browse-modal {
    background: var(--bg); color: var(--fg); border-radius: 10px;
    width: min(480px, 92vw); max-height: 80vh; display: flex;
    flex-direction: column; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  .artifact-browse-header {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 1rem; border-bottom: 1px solid var(--border);
  }
  .artifact-browse-header strong { flex: 1 1 auto; font-size: 0.9rem; }
  .artifact-browse-header button {
    font-size: 1.1rem; line-height: 1; background: none; border: none;
    color: var(--fg); cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 6px;
  }
  .artifact-browse-header button:hover { background: var(--assistant-bg); }
  .artifact-browse-warning {
    font-size: 0.72rem; opacity: 0.85; padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .artifact-browse-list {
    overflow-y: auto; padding: 0.4rem 0;
  }
  .artifact-browse-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 1rem; font-size: 0.8rem;
  }
  .artifact-browse-row:hover { background: var(--assistant-bg); }
  .artifact-browse-row button.artifact-browse-open {
    flex: 1 1 auto; text-align: left; background: none; border: none;
    color: var(--fg); cursor: pointer; padding: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .artifact-browse-row a.artifact-browse-newtab {
    flex: 0 0 auto; font-size: 0.7rem; color: var(--dim); text-decoration: none;
    border: 1px solid var(--border); border-radius: 6px; padding: 0.15rem 0.4rem;
  }
  .artifact-browse-row a.artifact-browse-newtab:hover { border-color: var(--dim); color: var(--fg); }
  .artifact-browse-empty, .artifact-browse-error {
    padding: 1rem; font-size: 0.8rem; opacity: 0.8; text-align: center;
  }
  .artifact-browse-truncated {
    font-size: 0.7rem; opacity: 0.7; text-align: center; padding: 0.4rem;
  }

  /* --- Settings: full-screen modal over the chat view, driven entirely
     by /api/settings/schema -- no per-field markup is hardcoded here, so
     a new FieldSpec on the Python side (src/convobox/config.py +
     scripts/settings_tui.py's SECTION_SPECS) just works without a
     matching frontend change. --- */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem; z-index: 100;
  }
  .settings-overlay[hidden] { display: none; }
  .settings-modal {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 10px;
    width: min(720px, 100%); max-height: 88vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .settings-header {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.7rem 1rem; border-bottom: 1px solid var(--border);
  }
  .settings-header h2 { margin: 0; font-size: 1rem; flex: 1 1 auto; }
  .settings-header button {
    font-size: 1.1rem; line-height: 1; background: none; border: none;
    color: var(--fg); cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 6px;
  }
  .settings-header button:hover { background: var(--assistant-bg); }
  .settings-tabs { display: flex; flex-wrap: wrap; gap: 0.3rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); }
  .settings-tabs button {
    font-size: 0.78rem; padding: 0.3rem 0.6rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  .settings-tabs button.active { background: var(--assistant-bg); font-weight: 600; }
  /* Restart-required marker: a distinct GLYPH (not just a color dot --
     WCAG 1.4.1, color is never the only signal), aria-hidden since the
     tab's own title attribute and the always-visible banner in
     .settings-section-note below are what actually carry the meaning to
     assistive tech, not this decorative mark. */
  .settings-tabs button .restart-mark { margin-left: 0.3rem; opacity: 0.75; }
  .settings-errors { font-size: 0.78rem; color: var(--error-fg); padding: 0.5rem 1rem 0; }
  .settings-body { flex: 1 1 auto; overflow-y: auto; padding: 0.8rem 1rem; }
  .settings-section-note {
    font-size: 0.78rem; padding: 0.5rem 0.7rem; margin-bottom: 0.8rem;
    border-radius: 6px; border: 1px solid var(--border);
  }
  .settings-section-note.restart { border-color: #e0a030; }
  .settings-section-note.live { border-color: #2e7d32; }
  .settings-field { margin-bottom: 0.9rem; }
  .settings-field label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.25rem; }
  .settings-field .help { font-size: 0.72rem; color: var(--dim); margin-top: 0.25rem; }
  .settings-field input[type="text"], .settings-field input[type="number"], .settings-field select {
    width: 100%; font-size: 0.85rem; padding: 0.35rem 0.5rem;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg);
  }
  .settings-field input[type="checkbox"] { width: 1.1rem; height: 1.1rem; }
  .settings-field-row { display: flex; align-items: center; gap: 0.4rem; }
  .settings-field-row select, .settings-field-row input { flex: 1 1 auto; }
  .settings-test-btn {
    flex: 0 0 auto; font-size: 0.72rem; padding: 0.32rem 0.55rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  .settings-test-btn:hover:not(:disabled) { border-color: var(--dim); }
  .settings-footer {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.7rem 1rem; border-top: 1px solid var(--border);
  }
  .settings-footer .spacer { flex: 1 1 auto; }
  .settings-status { font-size: 0.78rem; }
  .settings-status.error { color: var(--error-fg); }
  .settings-status.pending::before {
    content: ""; display: inline-block; width: 0.7em; height: 0.7em;
    margin-right: 0.4em; border: 2px solid currentColor;
    border-top-color: transparent; border-radius: 50%;
    animation: settings-spin 0.8s linear infinite; vertical-align: -0.1em;
  }
  @keyframes settings-spin { to { transform: rotate(360deg); } }
  /* WCAG 2.3.3 -- never animate without checking this. An infinite spin
     can be a genuine vestibular-disorder trigger, not just a preference;
     the pending state is still fully conveyed by the text next to it
     ("Testing… (Ns)"), so freezing the spinner loses no information. */
  @media (prefers-reduced-motion: reduce) {
    .settings-status.pending::before { animation: none; }
  }
  .settings-footer button {
    font-size: 0.82rem; padding: 0.4rem 0.8rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  .settings-footer button.primary { background: #1a56db; border-color: #1a56db; color: #fff; }
  .settings-footer button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header class="ribbon">
  <img class="logo" src="img/legionforge-logo.svg" alt="LegionForge">
  <span class="brand">ConvoBox</span>
  <span id="status" class="disconnected" role="status" aria-live="polite">connecting&hellip;</span>
  <span id="activity-status" role="status" aria-live="polite"></span>
  <span class="spacer"></span>
  <label for="session-select" class="visually-hidden">Saved session</label>
  <select id="session-select" title="Switch between saved conversation sessions -- only populated when Settings &gt; Web &gt; history tracking is on"></select>
  <button id="clear-history-btn" title="Permanently deletes this session's saved history from disk. Cannot be undone -- does not affect the live conversation still on screen.">Clear history</button>
  <button id="listening-btn" title="Pause listening (hard-stops in-flight work); say the resume word to resume by voice instead" aria-label="Pause listening"><span id="listening-btn-icon" aria-hidden="true">&#9208;</span><span id="listening-btn-label">Stop listening</span></button>
  <button id="stop-btn" class="stop-btn" title="Interrupts and stops all processing right now -- the same hard stop as saying the safeword out loud. Does not pause listening; the session keeps listening normally right after."><span aria-hidden="true">&#9209;</span> Stop</button>
  <button id="artifact-browse-btn" title="Browse renderable files in the backend's working directory"><span aria-hidden="true">&#128193;</span> Browse files</button>
  <button id="settings-btn" title="Open Settings -- edit convobox.yaml (audio devices, STT/TTS, safety phrases) without restarting"><span aria-hidden="true">&#9881;</span> Settings</button>
  <button id="quit-btn" class="quit-btn" title="Ends the whole ConvoBox session -- mic, backend, and this page's own connection. Click once to arm, click again within a few seconds to actually quit."><span aria-hidden="true">&#9211;</span><span id="quit-btn-label">Quit</span></button>
</header>
<div class="body-row">
<main>
  <div id="events-scroll">
    <div id="events">
      <div id="empty">No events yet.</div>
    </div>
  </div>
  <div id="drop-overlay" hidden>Drop to upload &mdash; goes into the backend's working directory</div>
  <form id="composer">
    <label for="composer-input" class="visually-hidden">Message to send</label>
    <textarea id="composer-input" placeholder="Type a message&hellip;" rows="1"></textarea>
    <button id="composer-send-btn" type="submit" title="Send this message to the backend (Enter also sends; Shift+Enter for a new line)">Send</button>
  </form>
</main>
<aside id="artifact-pane" hidden>
  <div id="artifact-resize-handle" role="separator" aria-orientation="vertical"
       aria-label="Resize artifact pane" tabindex="0"></div>
  <div id="artifact-tabs" role="tablist" aria-label="Open artifacts" hidden></div>
  <div class="artifact-pane-header">
    <span id="artifact-pane-title"></span>
    <a id="artifact-pane-editor-link" href="#" target="_blank" rel="noopener noreferrer" hidden
       title="Open this file in VS Code (requires VS Code installed with its vscode:// URI handler registered -- the default on a normal install)">Open in editor</a>
    <button id="artifact-pane-close-btn" type="button" aria-label="Close artifact pane" title="Close the artifact pane">&times;</button>
  </div>
  <div id="artifact-pane-body"></div>
</aside>
</div>
<div id="artifact-browse-overlay" class="artifact-browse-overlay" hidden>
  <div class="artifact-browse-modal" role="dialog" aria-modal="true" aria-labelledby="artifact-browse-title">
    <div class="artifact-browse-header">
      <strong id="artifact-browse-title">Browse working directory</strong>
      <button id="artifact-browse-close-btn" type="button" aria-label="Close" title="Close">&times;</button>
    </div>
    <div class="artifact-browse-warning">Files below were written by the backend agent and have not been reviewed for safety. HTML/scripts render sandboxed, but treat all contents as untrusted.</div>
    <div id="artifact-browse-list" class="artifact-browse-list"></div>
  </div>
</div>
<div id="settings-overlay" class="settings-overlay" hidden>
  <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-header">
      <h2 id="settings-title">Settings</h2>
      <button id="settings-close-btn" type="button" aria-label="Close settings" title="Close settings">&times;</button>
    </div>
    <div id="settings-tabs" class="settings-tabs"></div>
    <div id="settings-errors" class="settings-errors" role="alert" hidden></div>
    <div id="settings-body" class="settings-body"></div>
    <div class="settings-footer">
      <button id="settings-test-section-btn" type="button" class="settings-test-btn" hidden title="Try this tab's current settings live without saving them to disk yet (e.g. downloads/tests an STT or TTS model)">Test this section</button>
      <button id="settings-cancel-test-btn" type="button" class="settings-test-btn" hidden title="Stop waiting for the test -- the server keeps running it in the background regardless">Cancel</button>
      <span id="settings-status" class="settings-status" role="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <button id="settings-save-btn" type="button" class="primary" title="Save changes to convobox.yaml -- some settings need a restart to take effect">Save</button>
    </div>
  </div>
</div>
<script>
// Required on every mutating (POST/PUT/PATCH/DELETE) request -- the
// backend's own middleware rejects any without it (src/convobox/web/
// app.py). A custom header forces the browser to CORS-preflight even a
// body-less POST, closing a real CSRF gap: without this, a cross-origin
// page's `fetch(url, {method:"POST"})` reached routes like /api/quit,
// /api/stop, and /api/sessions/{id}/clear with no preflight at all --
// CORS only controls whether the ATTACKING page can read the response,
// never whether the browser sends a "simple" request in the first
// place. Found via autonomous codebase review, 2026-08-08 (GitHub
// issue #235, finding A3).
//
// Declared here, OUTSIDE both of this page's IIFEs (this script block's
// and the settings-modal script block's) -- true page-global scope, not
// either IIFE's own module-like closure. A prior version of this fix
// declared it INSIDE the first IIFE, which left every fetch() call in
// the second one (fetchSchema/testSettings/saveSettings -- the entire
// settings-save flow, i.e. exactly A4's own route) throwing
// `ReferenceError: CSRF_HEADERS is not defined` at runtime -- caught
// live via a real browser + console error check, not assumed.
const CSRF_HEADERS = { "X-ConvoBox-Client": "1" };

(function () {
  "use strict";

  const eventsEl = document.getElementById("events");
  const emptyEl = document.getElementById("empty");
  const statusEl = document.getElementById("status");
  const activityStatusEl = document.getElementById("activity-status");
  const listeningBtn = document.getElementById("listening-btn");
  const listeningBtnIcon = document.getElementById("listening-btn-icon");
  const listeningBtnLabel = document.getElementById("listening-btn-label");
  const stopBtn = document.getElementById("stop-btn");
  const sessionSelect = document.getElementById("session-select");
  const clearHistoryBtn = document.getElementById("clear-history-btn");
  const quitBtn = document.getElementById("quit-btn");
  const quitBtnLabel = document.getElementById("quit-btn-label");
  const artifactPaneEl = document.getElementById("artifact-pane");
  const artifactTitleEl = document.getElementById("artifact-pane-title");
  const artifactBodyEl = document.getElementById("artifact-pane-body");
  const artifactCloseBtn = document.getElementById("artifact-pane-close-btn");
  const artifactEditorLink = document.getElementById("artifact-pane-editor-link");
  const artifactTabsEl = document.getElementById("artifact-tabs");
  const artifactResizeHandle = document.getElementById("artifact-resize-handle");
  const artifactBrowseBtn = document.getElementById("artifact-browse-btn");
  const artifactBrowseOverlay = document.getElementById("artifact-browse-overlay");
  const artifactBrowseCloseBtn = document.getElementById("artifact-browse-close-btn");
  const artifactBrowseListEl = document.getElementById("artifact-browse-list");
  const composerForm = document.getElementById("composer");
  const composerInput = document.getElementById("composer-input");
  const composerSendBtn = document.getElementById("composer-send-btn");
  const mainEl = document.querySelector("main");
  const dropOverlayEl = document.getElementById("drop-overlay");
  let currentSessionId = null;

  // Artifact Chooser state (docs/ARTIFACT-PANE-SCOPE.md's "Artifact
  // Chooser" section) -- one ordered list per page-view, reset whenever
  // the viewed session changes (loadHistory below). Identity key is the
  // resolved artifact path: a later event for a path already in this
  // list updates that SAME entry (content + timestamp) rather than
  // appending a duplicate, matching the pane's own existing
  // refresh-in-place behavior -- this is the same mechanism, not two.
  let artifactTabs = [];
  let activeArtifactPath = null;

  function upsertArtifactTab(path) {
    const label = path.split("/").pop() || path;
    const existing = artifactTabs.find((t) => t.path === path);
    if (existing) {
      existing.timestamp = Date.now();
    } else {
      artifactTabs.push({ path, label, timestamp: Date.now() });
    }
    activeArtifactPath = path;
    renderArtifactTabs();
  }

  function renderArtifactTabs() {
    artifactTabsEl.innerHTML = "";
    artifactTabsEl.hidden = artifactTabs.length < 2;
    for (const tab of artifactTabs) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "artifact-tab" + (tab.path === activeArtifactPath ? " active" : "");
      btn.textContent = tab.label;
      btn.title = tab.path;
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", tab.path === activeArtifactPath ? "true" : "false");
      btn.addEventListener("click", () => renderArtifact(tab.path));
      artifactTabsEl.appendChild(btn);
    }
  }

  // docs/ARTIFACT-PANE-SCOPE.md's v1 rendering scope: images render
  // directly, HTML renders sandboxed (agent-generated content, not this
  // page's own trusted UI -- never drop the sandbox attribute without a
  // real reason), source code renders syntax-highlighted (2026-08-07,
  // JP asked directly -- see _ARTIFACT_CODE_LANGUAGES below), everything
  // else in the serving route's own allowlist (pdf/csv/txt) falls back
  // to a plain download link.
  const _ARTIFACT_IMAGE_EXTENSIONS = new Set(["png", "jpg", "jpeg", "gif", "svg", "webp"]);
  const _ARTIFACT_HTML_EXTENSIONS = new Set(["html", "htm"]);
  // ext -> the highlight.js grammar name each vendored
  // vendor/highlightjs/languages/*.min.js file self-registers as (see
  // that directory's own NOTICE.md). Must stay in sync with
  // ARTIFACT_MEDIA_TYPES (src/convobox/adapters/base.py) -- that dict is
  // what actually gates whether an ARTIFACT event for a given extension
  // ever reaches this pane at all; this map only decides HOW to render
  // an already-allowed one, never whether it's allowed. .h defaults to
  // the cpp grammar rather than c -- close enough for most real-world
  // C headers and handles the (now-common) mixed C/C++ codebase case
  // better than the reverse choice would.
  const _ARTIFACT_CODE_LANGUAGES = new Map([
    ["js", "javascript"], ["mjs", "javascript"], ["cjs", "javascript"], ["jsx", "javascript"],
    ["ts", "typescript"], ["tsx", "typescript"],
    ["yaml", "yaml"], ["yml", "yaml"],
    ["java", "java"],
    ["c", "c"],
    ["h", "cpp"], ["cpp", "cpp"], ["cc", "cpp"], ["cxx", "cpp"], ["hpp", "cpp"], ["hh", "cpp"],
    ["cs", "csharp"],
    ["json", "json"],
    ["xml", "xml"],
    ["md", "markdown"],
  ]);
  let artifactLoadCounter = 0;

  // Lazy-loaded on first real use, not at page load -- most sessions
  // never open a code artifact, and the vendored bundle (core + every
  // language grammar) is real weight (~170KB uncompressed) not worth
  // paying for pages that only ever show images. Each URL loads and
  // executes at most once; concurrent renders share the same in-flight
  // promise instead of racing duplicate <script> tags.
  const _scriptLoadPromises = new Map();
  function loadScriptOnce(src) {
    if (!_scriptLoadPromises.has(src)) {
      _scriptLoadPromises.set(src, new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`failed to load ${src}`));
        document.head.appendChild(script);
      }));
    }
    return _scriptLoadPromises.get(src);
  }

  async function ensureHighlighter(lang) {
    // Core must load (and RUN) before any language file -- each
    // languages/*.min.js self-registers against the global `hljs` the
    // core script creates when it executes. Loading ORDER matters here,
    // not just eventual presence, which is why this awaits core first
    // rather than kicking off both loads in parallel.
    await loadScriptOnce("vendor/highlightjs/highlight.min.js");
    await loadScriptOnce(`vendor/highlightjs/languages/${lang}.min.js`);
  }

  async function renderCodeArtifact(url, filename, lang) {
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.className = `language-${lang}`;
    pre.appendChild(code);
    artifactBodyEl.appendChild(pre);
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      // textContent, never innerHTML -- this is agent-generated content,
      // not trusted markup (same reasoning as the HTML iframe's sandbox
      // attribute below). highlight.js's highlightElement() reads the
      // already-set textContent and wraps it in ITS OWN generated
      // markup; it never re-parses this text as HTML itself.
      code.textContent = text;
      await ensureHighlighter(lang);
      window.hljs.highlightElement(code);
    } catch (err) {
      console.error("code artifact render failed", err);
      code.textContent = `Failed to load ${filename}: ${err}`;
    }
  }

  function renderArtifact(path) {
    // Chooser bookkeeping first -- every caller (live ARTIFACT events,
    // history replay, a tab click, a Browse-files pick) funnels through
    // this one function, so this is the single place a tab gets
    // created/reselected. Must run BEFORE the tab-strip's own click
    // handler would re-trigger this (it just calls renderArtifact(path)
    // directly, not through upsertArtifactTab), so re-clicking the
    // already-active tab still re-fetches/re-renders correctly.
    upsertArtifactTab(path);
    // Cache-bust on EVERY render, same path or not -- "a later ARTIFACT
    // event for the same path is a refresh, not a new pane" (scope doc)
    // means the underlying file changed, so a stale cached image/iframe
    // must never be what's shown.
    artifactLoadCounter += 1;
    // Captured for the editor-uri staleness check below -- artifactLoadCounter
    // itself is only otherwise used as a cache-busting query param, it was
    // never actually compared against anywhere until now.
    const loadId = artifactLoadCounter;
    const encodedPath = path.split("/").map(encodeURIComponent).join("/");
    const url = `/api/artifacts/${encodedPath}?t=${Date.now()}_${artifactLoadCounter}`;
    const filename = path.split("/").pop() || path;
    const dot = filename.lastIndexOf(".");
    const ext = dot >= 0 ? filename.slice(dot + 1).toLowerCase() : "";

    artifactTitleEl.textContent = filename;
    artifactTitleEl.title = path;
    artifactBodyEl.innerHTML = "";
    artifactEditorLink.hidden = true;

    if (_ARTIFACT_IMAGE_EXTENSIONS.has(ext)) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = filename;
      artifactBodyEl.appendChild(img);
    } else if (_ARTIFACT_HTML_EXTENSIONS.has(ext)) {
      const iframe = document.createElement("iframe");
      iframe.src = url;
      iframe.title = filename;
      iframe.sandbox = "allow-scripts";
      artifactBodyEl.appendChild(iframe);
    } else if (_ARTIFACT_CODE_LANGUAGES.has(ext)) {
      renderCodeArtifact(url, filename, _ARTIFACT_CODE_LANGUAGES.get(ext));
    } else {
      const link = document.createElement("a");
      link.className = "artifact-fallback-link";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = `Download ${filename}`;
      artifactBodyEl.appendChild(link);
    }

    // "Open in editor" (best-effort): offered for every artifact type,
    // not just code -- VS Code opens images/PDFs fine too. Stays hidden
    // on any failure (e.g. a future no-working_dir edge case) rather
    // than showing a dead link; failure here is never fatal to the pane
    // itself, which is why this isn't awaited before showing the pane.
    //
    // Staleness guard (loadId === artifactLoadCounter): artifactEditorLink
    // is a single persistent element shared across every render, unlike the
    // body content above (a fresh <img>/<iframe>/<pre> each time, so a slow
    // stale response there just writes into a detached or since-overwritten
    // node). Without this check, two ARTIFACT events firing close together
    // let an older render's fetch resolve AFTER a newer one's and silently
    // overwrite the link with the wrong file's URI while the pane still
    // shows the newer, correct content. Live-reproduced 2026-08-11 -- see
    // docs/KNOWN-ISSUES.md.
    fetch(`/api/artifacts/${encodedPath}/editor-uri`)
      .then((res) => (res.ok ? res.json() : Promise.reject(new Error(`HTTP ${res.status}`))))
      .then((data) => {
        if (loadId !== artifactLoadCounter) return;
        artifactEditorLink.href = data.uri;
        artifactEditorLink.hidden = false;
      })
      .catch((err) => console.error("editor-uri fetch failed", err));

    reportActiveArtifact(path);
    artifactPaneEl.hidden = false;
  }

  // GitHub issue #280: the backend agent has no visibility into what
  // the pane is actually displaying unless the browser -- the only
  // place that truly knows (tab clicks, Browse-files opens, the pane
  // being closed) -- tells it. Fire-and-forget, same posture as the
  // editor-uri fetch above: this only feeds an informational MCP tool
  // (get_shown_artifact, web/mcp_server.py), never anything the pane's
  // own rendering depends on, so a failed report should never block or
  // visibly break the UI.
  function reportActiveArtifact(path) {
    fetch("/api/artifacts/active", {
      method: "POST",
      headers: { ...CSRF_HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    }).catch((err) => console.error("report active artifact failed", err));
  }

  artifactCloseBtn.addEventListener("click", () => {
    artifactPaneEl.hidden = true;
    reportActiveArtifact(null);
  });

  // Drag-to-resize on the pane's left border (see the CSS comment on
  // #artifact-resize-handle for why this replaced the native `resize`
  // CSS property). Plain mouse events, not Pointer Events -- verified
  // live that Chrome's CDP-driven automation input (used by this
  // project's own BrowserOS-based UAT) dispatches mousedown/mousemove/
  // mouseup but does not reliably synthesize the pointerdown/pointermove
  // compatibility events a first draft of this handler relied on, which
  // made the handle silently inert under automation while still working
  // for a real physical mouse. Mouse events work under both.
  (function initArtifactResize() {
    const MIN_WIDTH = 240; // matches #artifact-pane's min-width
    const MAX_WIDTH_FRACTION = 0.85; // matches #artifact-pane's max-width: 85vw
    let startX = 0;
    let startWidth = 0;

    function clamp(width) {
      return Math.min(Math.max(width, MIN_WIDTH), window.innerWidth * MAX_WIDTH_FRACTION);
    }

    function onMouseMove(e) {
      // Dragging LEFT (cursor moves to a smaller clientX) grows the
      // pane -- it's docked against the window's right edge, so its
      // left border is the only edge that actually moves.
      artifactPaneEl.style.width = `${clamp(startWidth + (startX - e.clientX))}px`;
    }

    function onMouseUp() {
      artifactResizeHandle.classList.remove("dragging");
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    }

    artifactResizeHandle.addEventListener("mousedown", (e) => {
      startX = e.clientX;
      startWidth = artifactPaneEl.getBoundingClientRect().width;
      artifactResizeHandle.classList.add("dragging");
      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
      e.preventDefault();
    });

    // Keyboard equivalent for the role="separator" contract -- arrow
    // keys nudge the width in fixed steps rather than requiring a drag.
    artifactResizeHandle.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const current = artifactPaneEl.getBoundingClientRect().width;
      const step = e.key === "ArrowLeft" ? 20 : -20;
      artifactPaneEl.style.width = `${clamp(current + step)}px`;
      e.preventDefault();
    });
  })();

  // --- Working-directory file browser (docs/ARTIFACT-PANE-SCOPE.md's
  // "Working-Directory File Browser" section): a small modal listing
  // GET /api/artifacts's filtered results. Opening a listed file reuses
  // renderArtifact() directly -- from this function's perspective, a
  // browsed file and a tool-produced ARTIFACT event are the same kind of
  // thing once opened (both just become/update a Chooser tab), only
  // discovered a different way. ---
  async function openArtifactBrowser() {
    artifactBrowseOverlay.hidden = false;
    artifactBrowseListEl.innerHTML = '<div class="artifact-browse-empty">Loading&hellip;</div>';
    let data;
    try {
      const res = await fetch("/api/artifacts");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (err) {
      artifactBrowseListEl.innerHTML = "";
      const errEl = document.createElement("div");
      errEl.className = "artifact-browse-error";
      errEl.textContent = `Could not list files: ${err}. Is backend.working_dir configured?`;
      artifactBrowseListEl.appendChild(errEl);
      return;
    }
    artifactBrowseListEl.innerHTML = "";
    if (data.files.length === 0) {
      const emptyRow = document.createElement("div");
      emptyRow.className = "artifact-browse-empty";
      emptyRow.textContent = "No renderable files found in the working directory yet.";
      artifactBrowseListEl.appendChild(emptyRow);
      return;
    }
    for (const path of data.files) {
      const row = document.createElement("div");
      row.className = "artifact-browse-row";

      const openBtn = document.createElement("button");
      openBtn.type = "button";
      openBtn.className = "artifact-browse-open";
      openBtn.textContent = path;
      openBtn.title = path;
      openBtn.addEventListener("click", () => {
        renderArtifact(path);
        artifactBrowseOverlay.hidden = true;
      });
      row.appendChild(openBtn);

      const encodedPath = path.split("/").map(encodeURIComponent).join("/");
      const newTabLink = document.createElement("a");
      newTabLink.className = "artifact-browse-newtab";
      newTabLink.href = `/api/artifacts/${encodedPath}`;
      newTabLink.target = "_blank";
      newTabLink.rel = "noopener noreferrer";
      newTabLink.textContent = "Open in new tab";
      row.appendChild(newTabLink);

      artifactBrowseListEl.appendChild(row);
    }
    if (data.truncated) {
      const note = document.createElement("div");
      note.className = "artifact-browse-truncated";
      note.textContent = "More files exist than are shown here.";
      artifactBrowseListEl.appendChild(note);
    }
  }

  artifactBrowseBtn.addEventListener("click", openArtifactBrowser);
  artifactBrowseCloseBtn.addEventListener("click", () => { artifactBrowseOverlay.hidden = true; });
  artifactBrowseOverlay.addEventListener("click", (ev) => {
    if (ev.target === artifactBrowseOverlay) artifactBrowseOverlay.hidden = true;
  });

  // transcript (the user's own speech) renders on the right, like an
  // outgoing text message; everything else (assistant response, tool
  // calls/results, approval requests, errors) renders on the left. "done"
  // is a turn-boundary marker only, never its own bubble.
  function side(kind) {
    return kind === "transcript" ? "from-user" : "from-other";
  }

  // The button-row for whichever approval_request is currently the live
  // one to answer, or null if none. Only one approval can be pending on
  // the backend at a time (a single process-wide ApprovalPromptGate), but
  // bubbles are append-only and never removed -- without this, an OLDER
  // approval's still-enabled buttons would stay clickable in the DOM
  // after a NEWER request replaced it, and clicking them would wrongly
  // act on the newer, unrelated request (the backend endpoint has no way
  // to tell "this click meant the old one").
  let pendingApprovalActions = null;

  function disableApprovalActions(row, message) {
    if (!row) return;
    row.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    let note = row.querySelector(".approval-note");
    if (!note) {
      note = document.createElement("div");
      note.className = "approval-note";
      note.setAttribute("role", "status");
      row.appendChild(note);
    }
    note.textContent = message;
  }

  function buildApprovalActions() {
    const row = document.createElement("div");
    row.className = "approval-actions";

    async function send(action) {
      row.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      let res, data;
      try {
        res = await fetch(`/api/sessions/${encodeURIComponent(currentSessionId)}/approval`, {
          method: "POST",
          headers: { ...CSRF_HEADERS, "Content-Type": "application/json" },
          body: JSON.stringify({ action }),
        });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        console.error("approval action failed", err);
        row.querySelectorAll("button").forEach((b) => { b.disabled = false; });
        return;
      }
      if (!res.ok) {
        // Most likely: already resolved by voice, or it timed out, between
        // this bubble rendering and the click landing -- surface that
        // plainly and lock the stale controls rather than leaving them
        // clickable with no explanation (lessons-ui-ux.md: a failed action
        // must say what happened, not fail silently).
        disableApprovalActions(row, data.detail || "Could not resolve -- it may have already been answered another way.");
        if (pendingApprovalActions === row) pendingApprovalActions = null;
        return;
      }
      if (action === "explain") {
        row.querySelectorAll("button").forEach((b) => { b.disabled = false; });
        let note = row.querySelector(".approval-note");
        if (!note) {
          note = document.createElement("div");
          note.className = "approval-note";
          note.setAttribute("role", "status");
          row.appendChild(note);
        }
        note.textContent = data.explanation ? `Kept open: ${data.explanation}` : "Kept open -- timeout reset.";
        return;
      }
      disableApprovalActions(row, action === "approve" ? "Approved." : "Denied.");
      if (pendingApprovalActions === row) pendingApprovalActions = null;
    }

    const specs = [
      ["approve-btn", "Approve", "Runs the pending command now — the same effect as saying the approval phrase out loud.", "Approve the pending command"],
      ["deny-btn", "Deny", "Blocks the pending command — the same effect as saying “no” out loud.", "Deny the pending command"],
      ["explain-btn", "Explain", "Keeps this request open and resets its timeout, so it won’t auto-deny while you read the detail above.", "Keep this request open and show its full detail"],
    ];
    for (const [cls, label, title, ariaLabel] of specs) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = cls;
      btn.textContent = label;
      btn.title = title;
      btn.setAttribute("aria-label", ariaLabel);
      btn.addEventListener("click", () => send(label.toLowerCase()));
      row.appendChild(btn);
    }
    return row;
  }

  function renderEvent(ev) {
    const kind = ev.event_type || ev.type || "event";
    if (kind === "done") return;
    if (kind === "dropped") {
      // EventBroadcaster's bounded-queue backpressure marker (src/convobox/
      // web/stream.py) -- this tab's SSE queue fell behind and some live
      // events were evicted to make room for newer ones. No chat bubble
      // (there's no transcript/response content to show, only a count) --
      // logged so it's still discoverable if a session looks like it's
      // missing turns.
      console.warn(`live event stream dropped ${ev.count} event(s) -- this tab fell behind`);
      return;
    }
    if (kind === "artifact") {
      // No chat bubble for this one -- the pane IS the rendering, a
      // bubble would just be empty (nothing in the backend_response/
      // content/tool_output chain below applies to an artifact_path).
      // artifact_path is only ever present at the top level on the live
      // SSE shape (event_to_dict, see stream.py) -- a replayed history
      // row from GET /api/sessions/{id}/events is a raw DB row instead,
      // which only carries the same data nested inside its own
      // backend_event_json string column (history.py's HistoryDB stores
      // event_to_dict()'s output there verbatim). Parse it here for the
      // Chooser's history-replay seed (docs/ARTIFACT-PANE-SCOPE.md) --
      // this used to silently no-op on replay, a known-and-documented
      // gap this closes rather than leaving as a TODO.
      let path = ev.artifact_path;
      if (!path && ev.backend_event_json) {
        try {
          path = JSON.parse(ev.backend_event_json).artifact_path;
        } catch (err) {
          console.error("failed to parse backend_event_json for artifact replay", err);
        }
      }
      if (path) renderArtifact(path);
      return;
    }
    if (emptyEl.parentNode) emptyEl.remove();

    const row = document.createElement("div");
    row.className = "bubble-row " + side(kind);

    const bubble = document.createElement("div");
    bubble.className = "bubble " + kind;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = displayNames[kind] || kind.replace(/_/g, " ");
    bubble.appendChild(meta);

    if (kind === "tool_call" || kind === "tool_result") {
      // Collapsed by default (a tool-heavy turn can otherwise dump a wall
      // of raw input/output into the transcript) -- <details> handles the
      // click-to-expand itself, no click handler needed here.
      // ev.tool (live SSE shape, event_to_dict) vs ev.tool_name (persisted
      // history row shape) name the same field -- same reasoning as
      // kind's own event_type/type fallback above.
      const toolName = ev.tool_name || ev.tool || "tool";
      const detail = kind === "tool_call"
        ? (ev.tool_input || "(no input)")
        : (ev.backend_response || ev.tool_output || "(no output)");
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = kind === "tool_call" ? toolName : `${toolName} result`;
      details.appendChild(summary);
      const pre = document.createElement("div");
      pre.className = "tool-detail";
      // textContent, never innerHTML -- see the note below.
      pre.textContent = detail;
      details.appendChild(pre);
      bubble.appendChild(details);
    } else {
      const body = document.createElement("div");
      // textContent, never innerHTML -- transcripts/tool output/backend
      // responses are untrusted content (docs/WEB-UI-ARCHITECTURE.md's own
      // XSS-prevention note), so no HTML in them is ever interpreted.
      body.textContent = ev.backend_response || ev.content || ev.user_transcript || "";
      bubble.appendChild(body);
    }

    if (kind === "approval_request") {
      if (pendingApprovalActions) {
        disableApprovalActions(pendingApprovalActions, "Superseded by a newer request.");
      }
      const actions = buildApprovalActions();
      bubble.appendChild(actions);
      pendingApprovalActions = actions;
    }

    row.appendChild(bubble);
    eventsEl.appendChild(row);
    row.scrollIntoView({ block: "end" });
  }

  // Per-role bubble color overrides (convobox.yaml's display.user_color /
  // display.assistant_color, set via scripts/settings_tui.py). Setting
  // these as inline styles on the root element outranks the @media
  // (prefers-color-scheme: dark) block's :root rule regardless of the
  // system theme, so an operator-chosen color applies consistently in
  // both light and dark mode rather than needing a pair per theme.
  // Populated by loadDisplayConfig() before the first renderEvent() call
  // (init() awaits it first) -- display.user_name/assistant_name
  // (convobox.yaml, set via scripts/settings_tui.py or the web Settings
  // modal's Display tab). null means "show the raw event type", the
  // existing behavior.
  let displayNames = { transcript: null, response: null };

  async function loadDisplayConfig() {
    try {
      const res = await fetch("/api/config");
      const data = await res.json();
      if (data.user_color) document.documentElement.style.setProperty("--user-bg", data.user_color);
      if (data.assistant_color) document.documentElement.style.setProperty("--assistant-bg", data.assistant_color);
      displayNames = { transcript: data.user_name || null, response: data.assistant_name || null };
    } catch (err) {
      console.error("failed to load display config", err);
    }
  }

  // Populated by loadResumeWord() before the first renderActivityStatus()
  // call -- used only to make the "paused" status readable (which word
  // actually resumes listening), not for validation or anything security-
  // relevant, so a plain fetch of the same /api/settings the Settings
  // modal already uses is fine (no need to widen /api/config's
  // deliberately-scoped display-only response for this). Also grabs
  // web.history_tracking_enabled off the same response -- loadSessions()
  // uses it to explain an empty session picker (default is OFF, so an
  // empty dropdown there is the normal case, not obviously a bug).
  let resumeWord = null;
  let historyTrackingEnabled = null;

  async function loadResumeWord() {
    try {
      const res = await fetch("/api/settings");
      const data = await res.json();
      resumeWord = data.values?.interaction?.resume_word || null;
      historyTrackingEnabled = data.values?.web?.history_tracking_enabled ?? null;
    } catch (err) {
      console.error("failed to load resume word", err);
    }
  }

  async function loadSessions() {
    const res = await fetch("/api/sessions");
    const data = await res.json();
    sessionSelect.innerHTML = "";
    if (data.sessions.length === 0) {
      // An empty <select> with zero <option>s looks broken, not "there's
      // nothing here yet" -- give it a real, disabled placeholder that
      // explains WHY, since history tracking off (the default) is the
      // most likely reason, not an error.
      const placeholder = document.createElement("option");
      placeholder.textContent = historyTrackingEnabled === false
        ? "No saved sessions (history tracking is off in Settings)"
        : "No saved sessions yet";
      placeholder.disabled = true;
      placeholder.selected = true;
      sessionSelect.appendChild(placeholder);
      sessionSelect.disabled = true;
      return null;
    }
    sessionSelect.disabled = false;
    for (const s of data.sessions) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = `${s.id} (${s.last_activity})`;
      sessionSelect.appendChild(opt);
    }
    return data.sessions[0] ? data.sessions[0].id : null;
  }

  async function loadHistory(sessionId) {
    currentSessionId = sessionId || null;
    pendingApprovalActions = null;
    // Chooser state is per-viewed-session, not cross-session (deliberately
    // deferred in docs/ARTIFACT-PANE-SCOPE.md's "Deferred out of this
    // pass") -- switching sessions starts the tab strip fresh; replayed
    // ARTIFACT events below (if any) repopulate it for the newly-viewed
    // session.
    artifactTabs = [];
    activeArtifactPath = null;
    artifactPaneEl.hidden = true;
    reportActiveArtifact(null);
    renderArtifactTabs();
    if (!sessionId) return;
    const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/events`);
    const data = await res.json();
    eventsEl.innerHTML = "";
    if (data.events.length === 0) {
      eventsEl.appendChild(emptyEl);
      return;
    }
    for (const ev of data.events) renderEvent(ev);
  }

  // The mic loop's own activity (listening/capturing/speaking/working/
  // waiting/paused -- forward_status in src/convobox/web/bridge.py),
  // broadcast on the SAME SSE stream as transcript/tool events, tagged
  // {type: "status", ...} to tell them apart. Also keeps the Stop/Resume
  // listening button's label truthful even when a PAUSE happens by voice
  // instead of the button (both act on the same ListeningGate).
  let isPaused = false;

  function setListeningButton(paused) {
    isPaused = paused;
    // Icon is aria-hidden and purely decorative -- the label span's text
    // and the button's own aria-label are what a screen reader announces
    // and what carries the real state (WCAG 1.1.1: never icon-only).
    // ⏸ (pause bars) = "click to pause" (currently listening); ▶
    // (play triangle) = "click to resume" (currently paused) -- the same
    // convention as a media player's own play/pause button.
    listeningBtnIcon.textContent = paused ? "▶" : "⏸";
    listeningBtnLabel.textContent = paused ? "Resume listening" : "Stop listening";
    listeningBtn.setAttribute("aria-label", paused ? "Resume listening" : "Pause listening");
    listeningBtn.title = paused
      ? "Resume listening -- say the resume word to do this by voice instead"
      : "Pause listening (hard-stops in-flight work); say the resume word to resume by voice instead";
  }

  function renderActivityStatus(status, detail) {
    // detail is WorkingIndicator.current_activity (a tool name, or null
    // for "thinking, no tool call yet") -- only meaningful for "working",
    // same as the TUI's own [TOOL x]/[THINKING] heartbeat tag.
    let text = status;
    if (status === "paused" && resumeWord) {
      text = `paused (say "${resumeWord}" to resume)`;
    } else if (status === "working") {
      text = detail ? `working (${detail})` : "working (thinking)";
    }
    activityStatusEl.textContent = text;
    activityStatusEl.className = status === "paused" ? "paused" : "";
    setListeningButton(status === "paused");
  }

  function connectStream() {
    const source = new EventSource("/api/events/stream");
    source.onopen = () => {
      statusEl.textContent = "live";
      statusEl.className = "connected";
    };
    source.onerror = () => {
      statusEl.textContent = "reconnecting…";
      statusEl.className = "disconnected";
    };
    source.onmessage = (e) => {
      try {
        const payload = JSON.parse(e.data);
        if (payload.type === "status") {
          renderActivityStatus(payload.status, payload.detail);
        } else {
          renderEvent(payload);
        }
      } catch (err) {
        console.error("bad SSE payload", err);
      }
    };
    return source;
  }

  sessionSelect.addEventListener("change", () => loadHistory(sessionSelect.value));

  listeningBtn.addEventListener("click", async () => {
    listeningBtn.disabled = true;
    try {
      const res = await fetch("/api/listening", {
        method: "POST",
        headers: { ...CSRF_HEADERS, "Content-Type": "application/json" },
        body: JSON.stringify({ action: isPaused ? "resume" : "pause" }),
      });
      if (res.ok) {
        const data = await res.json();
        setListeningButton(data.is_paused);
      }
    } catch (err) {
      console.error("listening toggle failed", err);
    } finally {
      listeningBtn.disabled = false;
    }
  });

  // No arm/confirm step -- mirrors the spoken safeword, which also acts
  // the instant it's heard, not on a second repetition.
  stopBtn.addEventListener("click", async () => {
    stopBtn.disabled = true;
    const originalText = stopBtn.textContent;
    stopBtn.textContent = "Stopping…";
    try {
      await fetch("/api/stop", { method: "POST", headers: CSRF_HEADERS });
    } catch (err) {
      console.error("stop failed", err);
    } finally {
      stopBtn.disabled = false;
      stopBtn.textContent = originalText;
    }
  });

  // Enter sends (Shift+Enter for a newline, standard chat-box convention);
  // the <form> submit (button click or Enter with no handler override)
  // covers the rest. No local bubble render on success -- the same SSE
  // broadcast a spoken transcript triggers (WebTextInputBridge.submit ->
  // forward_transcript) is what renders it, so typed and spoken input
  // stay on one rendering path rather than risking a double-render.
  composerInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composerForm.requestSubmit();
    }
  });

  composerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = composerInput.value.trim();
    if (!text) return;
    composerInput.disabled = true;
    composerSendBtn.disabled = true;
    try {
      const res = await fetch("/api/text", {
        method: "POST",
        headers: { ...CSRF_HEADERS, "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (res.ok) {
        composerInput.value = "";
      } else {
        console.error("text submit failed", res.status, await res.text());
      }
    } catch (err) {
      console.error("text submit failed", err);
    } finally {
      composerInput.disabled = false;
      composerSendBtn.disabled = false;
      composerInput.focus();
    }
  });

  // Drag-and-drop upload (POST /api/upload -> convobox.web.uploads, fenced
  // to backend.working_dir). A drag-depth counter, not a plain dragenter/
  // dragleave pair -- the browser fires dragleave every time the pointer
  // crosses from main into a CHILD element (every bubble, the composer,
  // ...) and back, which would otherwise flicker the overlay on/off
  // constantly instead of just once per real enter/exit of main itself.
  let dragDepth = 0;

  mainEl.addEventListener("dragenter", (e) => {
    e.preventDefault();
    dragDepth += 1;
    dropOverlayEl.hidden = false;
  });
  mainEl.addEventListener("dragover", (e) => {
    // Required even with no other work to do -- without preventDefault()
    // here, the browser's default (open the file, don't fire "drop") wins.
    e.preventDefault();
  });
  mainEl.addEventListener("dragleave", (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropOverlayEl.hidden = true;
  });
  mainEl.addEventListener("drop", async (e) => {
    e.preventDefault();
    dragDepth = 0;
    dropOverlayEl.hidden = true;
    const files = Array.from(e.dataTransfer?.files || []);
    for (const file of files) {
      await uploadFile(file);
    }
  });

  async function uploadFile(file) {
    const formData = new FormData();
    formData.append("file", file);
    try {
      // CSRF_HEADERS only -- no Content-Type here, the browser must set
      // multipart/form-data's own boundary param itself; setting it
      // manually breaks the upload (app.py's CSRF middleware landed
      // after this feature was first written -- every mutating route
      // needs this header now, see require_csrf_header's own docstring).
      const res = await fetch("/api/upload", { method: "POST", headers: CSRF_HEADERS, body: formData });
      if (!res.ok) {
        console.error("upload failed", file.name, res.status, await res.text());
      }
      // No local bubble render on success, same reasoning as the composer
      // above -- the backend-notification message (app.py's
      // _notify_backend_of_upload -> WebTextInputBridge.submit) arrives
      // via the same SSE broadcast a typed/spoken transcript would.
    } catch (err) {
      console.error("upload failed", file.name, err);
    }
  }

  // Previously silent -- click did a fetch + reload with zero visible
  // feedback, so it looked like it did nothing even when it worked (and
  // gave no signal at all if the request failed). Same disable+relabel+
  // finally-reset pattern as stop-btn/quit-btn above, not a new one.
  clearHistoryBtn.addEventListener("click", async () => {
    if (!currentSessionId) return;
    clearHistoryBtn.disabled = true;
    const originalText = clearHistoryBtn.textContent;
    clearHistoryBtn.textContent = "Clearing…";
    try {
      const res = await fetch(
        `/api/sessions/${encodeURIComponent(currentSessionId)}/clear`,
        { method: "POST", headers: CSRF_HEADERS }
      );
      if (!res.ok) throw new Error(`clear failed: HTTP ${res.status}`);
      await loadHistory(currentSessionId);
      clearHistoryBtn.textContent = "Cleared";
      setTimeout(() => { clearHistoryBtn.textContent = originalText; }, 1500);
    } catch (err) {
      console.error("clear history failed", err);
      clearHistoryBtn.textContent = "Clear failed";
      setTimeout(() => { clearHistoryBtn.textContent = originalText; }, 2500);
    } finally {
      clearHistoryBtn.disabled = false;
    }
  });

  // Two clicks required: the first "arms" it (button restyles + relabels
  // to make the primed state unmistakable -- never color alone), the
  // second actually quits. Auto-disarms after a few seconds so an
  // accidental first click doesn't leave a live-fire button sitting
  // around. Ends the WHOLE ConvoBox process (mic, backend, and this
  // page's own connection) -- the fetch erroring out afterward is the
  // expected shape of that, not a bug.
  let quitArmed = false;
  let quitArmTimer = null;

  quitBtn.addEventListener("click", async () => {
    if (!quitArmed) {
      quitArmed = true;
      quitBtn.classList.add("armed");
      quitBtnLabel.textContent = "Click again to quit";
      quitBtn.title = "This will actually end the session. Click elsewhere or wait a few seconds to cancel.";
      quitArmTimer = setTimeout(() => {
        quitArmed = false;
        quitBtn.classList.remove("armed");
        quitBtnLabel.textContent = "Quit";
        quitBtn.title = "Ends the whole ConvoBox session -- mic, backend, and this page's own connection. Click once to arm, click again within a few seconds to actually quit.";
      }, 4000);
      return;
    }
    clearTimeout(quitArmTimer);
    quitBtn.disabled = true;
    quitBtnLabel.textContent = "Quitting…";
    try {
      await fetch("/api/quit", { method: "POST", headers: CSRF_HEADERS });
    } catch (err) {
      // The connection dying mid-request is the expected shape of a
      // process actually quitting, not a real error.
    }
    statusEl.textContent = "session ended";
    statusEl.className = "disconnected";
  });

  (async function init() {
    await loadDisplayConfig();
    await loadResumeWord();
    const latest = await loadSessions();
    await loadHistory(latest);
    try {
      const res = await fetch("/api/listening");
      if (res.ok) setListeningButton((await res.json()).is_paused);
    } catch (err) {
      console.error("failed to load listening state", err);
    }
    connectStream();
  })();
})();
</script>
<script>
(function () {
  "use strict";

  // Settings modal: a generic renderer driven by /api/settings/schema --
  // full parity target is scripts/settings_tui.py's own edit/validate/save
  // contract (docs/UAT-settings-tui.md), not a bespoke re-scoping of it.
  // Deliberately separate from the chat script above (own IIFE, own DOM
  // ids) so this file's two concerns -- live transcript vs. config editing
  // -- don't share mutable state by accident.

  const overlay = document.getElementById("settings-overlay");
  const tabsEl = document.getElementById("settings-tabs");
  const bodyEl = document.getElementById("settings-body");
  const errorsEl = document.getElementById("settings-errors");
  const statusEl = document.getElementById("settings-status");
  const closeBtn = document.getElementById("settings-close-btn");
  const saveBtn = document.getElementById("settings-save-btn");
  const testSectionBtn = document.getElementById("settings-test-section-btn");
  const cancelTestBtn = document.getElementById("settings-cancel-test-btn");
  const settingsBtn = document.getElementById("settings-btn");

  // Sections with a real probe_* hook in scripts/settings_tui.py (see
  // settings_api.py's /api/settings/test) -- everything else just gets
  // "<section> configuration validated", not worth a button for.
  const TESTABLE_SECTIONS = ["tts", "stt", "backend", "audio"];

  let originalValues = null;
  let draft = null;
  let sections = [];
  let activeKey = null;

  function getPath(obj, path) {
    return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
  }
  function setPath(obj, path, value) {
    const keys = path.split(".");
    let o = obj;
    for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    o[keys[keys.length - 1]] = value;
  }

  // Not full shlex: handles the common "quoted argument with spaces"
  // case (matches backend.command's own help text example, e.g.
  // `codex.cmd --model gpt-5.6-terra`) but not shlex's escape-sequence
  // handling -- a documented, minor gap versus the TUI's real shlex.split.
  function splitCommand(text) {
    const re = /"([^"]*)"|'([^']*)'|(\S+)/g;
    const out = [];
    let m;
    while ((m = re.exec(text))) {
      out.push(m[1] !== undefined ? m[1] : m[2] !== undefined ? m[2] : m[3]);
    }
    return out;
  }

  async function fetchSchema() {
    const res = await fetch("/api/settings/schema", {
      method: "POST",
      headers: { ...CSRF_HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ values: draft }),
    });
    const data = await res.json();
    sections = data.sections;
    if (!sections.some((s) => s.key === activeKey)) activeKey = sections[0].key;
    renderTabs();
    renderBody();
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    for (const section of sections) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.append(section.label);
      // Glyph, not color alone (WCAG 1.4.1) -- restart_required comes
      // straight from scripts/settings_tui.py's SectionSpec, confirmed
      // per-section against what run_convobox.py's mic-loop pipeline
      // actually reads at startup vs. what only ever feeds a web route
      // (see that dataclass field's own docstring). aria-hidden: the
      // title below and the section-body banner (renderBody) are what
      // actually carry this to assistive tech, not this decoration.
      const mark = document.createElement("span");
      mark.className = "restart-mark";
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = section.restart_required ? "⟳" : "✓";
      btn.appendChild(mark);
      btn.title = section.restart_required
        ? `${section.label}: changes here need ConvoBox restarted to take effect`
        : `${section.label}: changes here apply on your next page refresh -- no restart needed`;
      btn.className = section.key === activeKey ? "active" : "";
      btn.addEventListener("click", () => {
        activeKey = section.key;
        renderTabs();
        renderBody();
      });
      tabsEl.appendChild(btn);
    }
  }

  // path (e.g. "audio.input_device") -> a valid, stable HTML id -- shared
  // by buildInput() (sets it on the control) and buildFieldRow() (points
  // its <label for> at it). Every settings field previously rendered a
  // <label> with no for/id association at all -- programmatically
  // invisible to a screen reader, same gap the inclusive-design lessons'
  // forms section calls out explicitly ("every input needs a <label>,
  // not a placeholder" -- true here for the missing ASSOCIATION too, not
  // just placeholder-only inputs).
  function fieldElementId(path) {
    return `field-${path.replace(/\./g, "-")}`;
  }

  // Kind -> control. Picker kinds (choice/device/kokoro_voice/piper_voice/
  // piper_speaker) share one <select> path: field.unset_value/
  // unavailable_value (from settings_api.py's _field_to_dict) are the
  // TUI's own sentinel strings, never hardcoded here.
  function buildInput(field, path) {
    const value = getPath(draft, path);
    const fieldId = fieldElementId(path);

    if (field.kind === "bool") {
      const input = document.createElement("input");
      input.id = fieldId;
      input.type = "checkbox";
      input.checked = Boolean(value);
      input.addEventListener("change", () => {
        setPath(draft, path, input.checked);
        fetchSchema();
      });
      return input;
    }

    if (["choice", "device", "kokoro_voice", "piper_voice", "piper_speaker"].includes(field.kind)) {
      const select = document.createElement("select");
      select.id = fieldId;
      for (const choice of field.choices) {
        const opt = document.createElement("option");
        opt.value = choice;
        opt.textContent = choice;
        select.appendChild(opt);
      }
      const shown = value === null || value === undefined ? field.unset_value : value;
      if (shown !== null && shown !== undefined) select.value = shown;
      select.disabled = field.choices.length === 1 && field.choices[0] === field.unavailable_value;
      select.addEventListener("change", () => {
        const picked = select.value;
        setPath(draft, path, picked === field.unset_value ? null : picked);
        fetchSchema();
      });
      return select;
    }
